<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐾 柴柴股票管家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans TC',sans-serif;
  background:#FFF0F3;
  max-width:480px;margin:0 auto;
  min-height:100vh;overflow-x:hidden;
  padding-bottom:80px;
  color:#8B5E3C;font-size:16px;line-height:1.6;
  position:relative;
}
/* Floating background decorations */
body::before{
  content:'🐾🐾🐾🐾🐾';
  position:fixed;top:10%;left:5%;
  font-size:40px;opacity:.04;transform:rotate(-15deg);
  pointer-events:none;z-index:0;
  letter-spacing:60px;white-space:nowrap;
}
body::after{
  content:'⭐✨💕🐾✨';
  position:fixed;bottom:15%;right:5%;
  font-size:30px;opacity:.04;transform:rotate(10deg);
  pointer-events:none;z-index:0;
  letter-spacing:40px;white-space:nowrap;
}

/* ===== HEADER (compact, like picture) ===== */
.header{
  background:linear-gradient(135deg,#FFB5C2,#FFD1DC);
  padding:14px 20px 16px;color:#8B5E3C;position:relative;overflow:hidden;
}
.htitle{
  font-family:'ZCOOL KuaiLe',cursive;
  font-size:20px;display:flex;align-items:center;gap:6px;
}
.hsub{font-size:12px;opacity:.6;margin:0 0 10px 42px}
/* Big pink summary card (like picture - unified card) */
.summary-pink-card{
  background:linear-gradient(135deg,#FFE4E9,#fff);
  border-radius:20px;padding:18px 20px;margin:0 12px 10px;
  border:2.5px solid #F09AAA;
  box-shadow:0 4px 20px rgba(212,98,122,.12);
  position:relative;
}
.summary-pink-card::after{
  content:'🐾';position:absolute;bottom:-4px;right:8px;font-size:28px;opacity:.1;
}
.summary-inner{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.summary-label{font-size:14px;color:#B58A96;font-family:'ZCOOL KuaiLe',cursive}
.summary-value{font-size:22px;font-weight:700;color:#D4627A;font-family:'ZCOOL KuaiLe',cursive}
.summary-detail{display:flex;justify-content:space-between;gap:4px}
.summary-item{flex:1;text-align:center;background:rgba(255,255,255,.5);border-radius:14px;padding:8px 4px}
.summary-item-val{font-size:15px;font-weight:700;color:#8B5E3C;font-family:'ZCOOL KuaiLe',cursive}
.summary-item-lbl{font-size:10px;color:#B58A96;margin-top:1px}
/* Refresh bubble button (like picture) */
.refresh-bubble{
  margin:0 12px 8px;padding:12px;
  border-radius:20px;
  background:linear-gradient(135deg,#FFB5C2,#D4627A);
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  transition:all .2s;font-family:'ZCOOL KuaiLe',cursive;letter-spacing:1px;
  box-shadow:0 4px 16px rgba(212,98,122,.25);
  border:none;width:calc(100% - 24px);display:block;
  text-align:center;
}
.refresh-bubble:active{transform:scale(.97);box-shadow:0 2px 8px rgba(212,98,122,.2)}
.refresh-bubble:disabled{opacity:.5;transform:none}

/* ===== LOGIN ===== */
.login-page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#FFF0F3,#FFE4E9);padding:20px;
  position:relative;overflow:hidden;
}
.login-page::before{
  content:'🐕🐾💕🐾🐕🐾💕🐾';
  position:absolute;top:5%;left:0;right:0;text-align:center;
  font-size:28px;opacity:.08;letter-spacing:20px;white-space:nowrap;
}
.login-box{
  background:#fff;border-radius:24px;padding:36px 28px;
  width:100%;max-width:380px;box-shadow:0 8px 40px rgba(212,98,122,.12);
  text-align:center;position:relative;z-index:1;
  border:3px dashed #FFB5C2;
}
.login-icon{font-size:72px;margin-bottom:4px;animation:bob 3s ease-in-out infinite}
.login-icon-svg{width:80px;height:80px;margin:0 auto 8px}
.login-title{
  font-family:'ZCOOL KuaiLe',cursive;
  font-size:28px;color:#D4627A;margin-bottom:4px;
}
.login-desc{font-size:14px;color:#B58A96;margin-bottom:24px}
.login-input{
  width:100%;padding:14px 16px;
  border:2.5px dashed #FFD1DC;border-radius:16px;
  font-size:16px;outline:none;margin-bottom:12px;text-align:center;
  transition:border-color .3s;background:#FFFBFD;
  font-family:'ZCOOL KuaiLe',cursive;color:#8B5E3C;
}
.login-input:focus{border-color:#FFB5C2;border-style:solid}
.login-input::placeholder{color:#FFD1DC;font-family:'Noto Sans TC',sans-serif}
.login-row{display:flex;gap:10px;margin-bottom:16px}
.login-btn{
  flex:1;padding:14px 20px;border:none;border-radius:18px;
  font-size:16px;font-weight:700;cursor:pointer;
  transition:all .2s;font-family:'ZCOOL KuaiLe',cursive;
}
.login-btn:active{transform:scale(.95)}
.login-primary{
  background:linear-gradient(135deg,#FFB5C2,#D4627A);
  color:#fff;box-shadow:0 4px 12px rgba(212,98,122,.3);
}
.login-secondary{
  background:#FFF0F3;color:#B58A96;border:2px dashed #FFB5C2;
}
.login-error{color:#e53935;font-size:14px;margin-top:8px;display:none}
.login-switch{color:#D4627A;cursor:pointer;font-size:14px;margin-top:4px;background:none;border:none;font-family:'ZCOOL KuaiLe',cursive}
.login-switch:active{opacity:.7}

/* ===== FETCH STATUS ===== */
.fetch-status{font-size:12px;color:#B58A96;text-align:center;margin-top:4px;display:none}

/* ===== SECTION TITLE ===== */
.sec-title{
  font-family:'ZCOOL KuaiLe',cursive;
  font-size:16px;font-weight:700;color:#B58A96;
  padding:16px 20px 8px;display:flex;align-items:center;gap:6px;
}
.sec-title::before{content:'🐾'}
.sec-title::after{content:'💕';font-size:12px;margin-left:auto;opacity:.5}

/* ===== STOCK CARD (like picture - brown border) ===== */
.stock-card{
  background:#fff;margin:6px 12px;padding:14px 16px;
  border-radius:18px;
  box-shadow:0 3px 16px rgba(180,120,100,.08),0 0 0 2px #C4956A;
  position:relative;overflow:hidden;
  transform:rotate(var(--rot,0deg));
  transition:transform .2s;
}
.stock-card:nth-child(odd){--rot:-.5deg}
.stock-card:nth-child(even){--rot:.5deg}
.stock-card::before{
  content:'🐾';position:absolute;bottom:-4px;right:-2px;
  font-size:32px;opacity:.08;
}
.stock-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.stock-left{flex:1}
.stock-name{font-size:17px;font-weight:700;color:#8B5E3C;font-family:'ZCOOL KuaiLe',cursive}
.stock-code{font-size:12px;color:#B58A96;margin-left:4px}
.stock-price-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.stock-price-label{font-size:11px;color:#B58A96}
.stock-price-num{font-size:18px;font-weight:700;color:#8B5E3C;font-family:'ZCOOL KuaiLe',cursive}
.stock-pl{font-size:18px;font-weight:700;text-align:right;font-family:'ZCOOL KuaiLe',cursive}
.stock-pl small{font-size:11px;font-weight:500}
.stock-info-row{display:flex;gap:12px;font-size:12px;color:#B58A96;margin-bottom:8px}
.stock-info-row span{background:#FFF0F3;padding:2px 10px;border-radius:10px}
.stock-actions{display:flex;justify-content:flex-end;gap:6px;padding-top:8px;border-top:1.5px solid #F0D5C0}
.stock-btn{
  padding:7px 16px;border:none;border-radius:14px;
  font-size:13px;font-weight:700;cursor:pointer;
  transition:all .2s;font-family:'ZCOOL KuaiLe',cursive;
}
.stock-btn:active{transform:scale(.92)}
.stock-btn-sell{
  background:#FFF0F3;color:#D4627A;
  border:1.5px solid #F09AAA;box-shadow:0 2px 6px rgba(212,98,122,.1);
}
.stock-bottom{
  display:flex;justify-content:space-between;
  font-size:12px;color:#ccc;padding-top:8px;border-top:1px dashed #FFE4E9;
}

/* ===== ADD FORM ===== */
.add-card{
  background:#fff;margin:6px 12px;padding:18px;border-radius:18px;
  box-shadow:0 3px 16px rgba(212,98,122,.06),0 0 0 2.5px #FFD1DC;
}
.add-row{display:flex;gap:8px;margin-bottom:8px}
.add-input{
  flex:1;padding:12px;
  border:2px dashed #FFD1DC;border-radius:14px;
  font-size:15px;outline:none;background:#FFFBFD;color:#8B5E3C;
}
.add-input:focus{border-color:#FFB5C2;border-style:solid}
.add-input.small{max-width:80px}
.add-input::placeholder{color:#FFD1DC}
.add-btn{
  width:100%;padding:14px;border:none;border-radius:18px;
  background:linear-gradient(135deg,#FFB5C2,#D4627A);
  color:#fff;font-size:16px;font-weight:700;cursor:pointer;
  transition:all .2s;
  box-shadow:0 4px 12px rgba(212,98,122,.25);
  font-family:'ZCOOL KuaiLe',cursive;letter-spacing:2px;
}
.add-btn:active{transform:scale(.97)}

/* ===== SUMMARY ===== */
.sum-card{
  background:#fff;margin:6px 12px;padding:18px;border-radius:18px;
  box-shadow:0 3px 16px rgba(212,98,122,.06),0 0 0 2.5px #FFD1DC;
}
.sum-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sum-broker{font-size:16px;font-weight:700;color:#D4627A;font-family:'ZCOOL KuaiLe',cursive}
.sum-pl{font-size:22px;font-weight:700;font-family:'ZCOOL KuaiLe',cursive}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum-cell-val{font-size:18px;font-weight:700;color:#D4627A;font-family:'ZCOOL KuaiLe',cursive}
.sum-cell-label{font-size:11px;color:#B58A96;margin-top:2px}
.total-card{
  background:linear-gradient(135deg,#FFF0F3,#FFE4E9);
  margin:6px 12px 16px;padding:20px;border-radius:18px;
  box-shadow:0 3px 16px rgba(212,98,122,.06);
  text-align:center;position:relative;overflow:hidden;
  border:2.5px dashed #FFB5C2;
}
.total-card::after{
  content:'💰';position:absolute;bottom:-6px;right:10px;font-size:40px;opacity:.1;
}
.total-title{font-size:17px;font-weight:700;color:#D4627A;margin-bottom:12px;font-family:'ZCOOL KuaiLe',cursive}
.total-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.total-val{font-size:22px;font-weight:700;color:#D4627A;font-family:'ZCOOL KuaiLe',cursive}
.total-label{font-size:12px;color:#B58A96;margin-top:2px}
.total-roi{font-size:15px;font-weight:700;margin-top:10px;font-family:'ZCOOL KuaiLe',cursive}

/* ===== MINI STOCK (for summary page) ===== */
.stock-mini{
  background:#fff;margin:4px 12px;padding:12px 16px;border-radius:16px;
  box-shadow:0 2px 10px rgba(212,98,122,.05),0 0 0 2px #FFE4E9;
  display:flex;justify-content:space-between;align-items:center;
  transform:rotate(var(--rot2,0deg));
}
.stock-mini:nth-child(odd){--rot2:-.3deg}
.stock-mini:nth-child(even){--rot2:.3deg}
.stock-mini-left{flex:1}
.stock-mini-name{font-size:15px;font-weight:700;color:#8B5E3C;font-family:'ZCOOL KuaiLe',cursive}
.stock-mini-info{font-size:13px;color:#B58A96;margin-top:2px}
.stock-mini-del{
  width:34px;height:34px;border-radius:50%;
  border:2px dashed #FFB5C2;background:#FFF0F3;
  font-size:16px;color:#e53935;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.stock-mini-del:active{transform:scale(.88);background:#FFE4E9}

/* ===== HISTORY ===== */
.history-card{
  background:#fff;margin:4px 12px;padding:14px 16px;
  border-radius:16px;
  box-shadow:0 2px 10px rgba(212,98,122,.05),0 0 0 2px #FFE4E9;
  transform:rotate(var(--rot3,0deg));
}
.history-card:nth-child(odd){--rot3:-.3deg}
.history-card:nth-child(even){--rot3:.3deg}
.hist-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.hist-name{font-size:15px;font-weight:700;color:#8B5E3C;font-family:'ZCOOL KuaiLe',cursive}
.hist-type{
  display:inline-block;font-size:11px;padding:2px 12px;border-radius:14px;
  font-weight:700;margin-left:6px;font-family:'ZCOOL KuaiLe',cursive;
}
.hist-buy{background:#E0F2FE;color:#0369A1}
.hist-sell{background:#FCE7F3;color:#BE185D}
.hist-detail{font-size:13px;color:#8B5E3C;display:flex;flex-wrap:wrap;gap:4px 12px}
.hist-profit{font-size:14px;font-weight:700;font-family:'ZCOOL KuaiLe',cursive}
.hist-date{font-size:11px;color:#ccc;margin-top:4px}
.hist-date::before{content:'🕰️ ';font-size:10px}

/* ===== MODAL ===== */
.modal-overlay{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(212,98,122,.25);z-index:300;
  align-items:center;justify-content:center;padding:20px
}
.modal-overlay.show{display:flex}
.modal-box{
  background:#fff;border-radius:24px;padding:28px;
  width:100%;max-width:360px;max-height:90vh;overflow-y:auto;
  animation:fadeIn .3s;
  border:3px dashed #FFB5C2;
  box-shadow:0 8px 40px rgba(212,98,122,.15);
}
.modal-title{
  font-size:20px;font-weight:700;text-align:center;margin-bottom:16px;
  color:#D4627A;font-family:'ZCOOL KuaiLe',cursive;
}
.modal-info{text-align:center;margin-bottom:16px;color:#8B5E3C;font-size:14px}
.modal-info b{color:#D4627A}
.modal-row{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.modal-label{font-size:14px;color:#B58A96;white-space:nowrap;min-width:70px;font-family:'ZCOOL KuaiLe',cursive}
.modal-input{
  flex:1;padding:12px;
  border:2px dashed #FFD1DC;border-radius:14px;
  font-size:16px;text-align:center;outline:none;font-weight:700;
  background:#FFFBFD;color:#8B5E3C;font-family:'ZCOOL KuaiLe',cursive;
}
.modal-input:focus{border-color:#D4627A;border-style:solid}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-btn{
  flex:1;padding:14px;border:none;border-radius:18px;
  font-size:15px;font-weight:700;cursor:pointer;
  transition:all .2s;font-family:'ZCOOL KuaiLe',cursive;
}
.modal-btn:active{transform:scale(.95)}
.modal-cancel{background:#FFF0F3;color:#B58A96;border:2px dashed #FFB5C2}
.modal-confirm{
  background:linear-gradient(135deg,#FFB5C2,#D4627A);
  color:#fff;box-shadow:0 4px 12px rgba(212,98,122,.3);
}
.modal-profit{
  text-align:center;padding:14px;margin:10px 0;border-radius:14px;
  font-size:20px;font-weight:700;font-family:'ZCOOL KuaiLe',cursive;
}

/* ===== NAV ===== */
.bnav{
  position:fixed;bottom:0;left:0;right:0;
  background:#fff;display:flex;
  border-top:2.5px dashed #FFE4E9;
  padding:6px 0 10px;padding-bottom:max(10px,env(safe-area-inset-bottom));
  z-index:100;max-width:480px;margin:0 auto;
  box-shadow:0 -4px 20px rgba(212,98,122,.06);
}
.ni{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0;cursor:pointer;border:none;background:none;
  transition:transform .2s;
}
.ni:active{transform:scale(.9)}
.ni-icon{font-size:24px;transition:transform .3s}
.ni.active .ni-icon{transform:scale(1.1)}
.ni-lbl{
  font-size:11px;color:#B58A96;font-weight:500;
  font-family:'ZCOOL KuaiLe',cursive;
  transition:color .3s
}
.ni.active .ni-lbl{color:#D4627A;font-weight:700}

/* ===== TOAST ===== */
.toast{
  position:fixed;top:16px;left:16px;right:16px;
  max-width:448px;margin:0 auto;
  background:#059669;color:#fff;padding:14px 20px;border-radius:16px;
  font-size:15px;font-weight:500;z-index:200;
  transform:translateY(-120px);
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 4px 20px rgba(5,150,105,.3);
  font-family:'ZCOOL KuaiLe',cursive;
}
.toast.show{transform:translateY(0)}
.toast.err{background:#e53935;box-shadow:0 4px 20px rgba(229,57,53,.3)}
.empty{text-align:center;color:#FFD1DC;padding:40px 20px;font-size:15px}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.3}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn{
  0%{opacity:0;transform:scale(.95) rotate(-1deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}
@keyframes bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
@keyframes sparkle{
  0%,100%{opacity:0;transform:scale(.5)}
  50%{opacity:1;transform:scale(1)}
}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(-4px) rotate(2deg)}
  75%{transform:translateY(2px) rotate(-1deg)}
}

/* ===== SHABA SVG ===== */
.shiba-svg{display:none}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- Shiba Inu SVG sprite -->
<svg class="shiba-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple Shiba head icon -->
  <g id="shiba-head">
    <ellipse cx="50" cy="55" rx="28" ry="24" fill="#F5C542"/>
    <!-- Inner face -->
    <ellipse cx="50" cy="60" rx="20" ry="16" fill="#FFF8E7"/>
    <!-- Eyes -->
    <circle cx="40" cy="54" r="3.5" fill="#4A3728"/>
    <circle cx="60" cy="54" r="3.5" fill="#4A3728"/>
    <!-- Eye shine -->
    <circle cx="41.5" cy="52.5" r="1.2" fill="#fff"/>
    <circle cx="61.5" cy="52.5" r="1.2" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="50" cy="64" rx="4" ry="3" fill="#4A3728"/>
    <!-- Mouth -->
    <path d="M46 67 Q50 71 54 67" fill="none" stroke="#4A3728" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Ears -->
    <polygon points="25,38 18,12 36,30" fill="#F5C542" stroke="#E8A820" stroke-width="1"/>
    <polygon points="75,38 82,12 64,30" fill="#F5C542" stroke="#E8A820" stroke-width="1"/>
    <!-- Inner ears -->
    <polygon points="27,36 22,18 35,32" fill="#FDE68A"/>
    <polygon points="73,36 78,18 65,32" fill="#FDE68A"/>
  </g>
</svg>

<!-- === LOGIN PAGE === -->
<div id="login-page" class="login-page">
  <div class="login-box">
    <svg viewBox="0 0 100 100" style="width:80px;height:80px;margin:0 auto 4px"><use href="#shiba-head"/></svg>
    <div class="login-title">💰 股票管家</div>
    <div class="login-desc">🐾 可愛手繪風 · 每人自己的持股</div>
    <input class="login-input" id="login-user" placeholder="👤 使用者名稱" autocomplete="username">
    <input class="login-input" id="login-pass" type="password" placeholder="🔒 密碼 (至少4碼)" autocomplete="current-password" style="margin-bottom:4px">
    <div class="login-error" id="login-error"></div>
    <div class="login-row" style="margin-top:14px">
      <button class="login-btn login-secondary" id="btn-register">🆕 註冊</button>
      <button class="login-btn login-primary" id="btn-login">🔑 登入</button>
    </div>
    <p style="font-size:12px;color:#FFD1DC;margin-top:20px">資料存於伺服器，任何裝置都能用 🐾</p>
  </div>
</div>

<!-- === MAIN APP === -->
<div id="app" style="display:none">

  <!-- SELL MODAL -->
  <div class="modal-overlay" id="sell-modal">
    <div class="modal-box">
      <div class="modal-title">🐾 賣出持股</div>
      <div class="modal-info">賣出 <b id="sell-name"></b></div>
      <div class="modal-row">
        <span class="modal-label">賣出單價</span>
        <input class="modal-input" id="sell-price" type="number" step="0.01" placeholder="價格">
      </div>
      <div class="modal-row">
        <span class="modal-label">賣出張數</span>
        <input class="modal-input" id="sell-shares" type="number" placeholder="張數">
      </div>
      <div class="modal-profit" id="sell-profit" style="display:none"></div>
      <div class="modal-btns">
        <button class="modal-btn modal-cancel" onclick="closeSell()">取消</button>
        <button class="modal-btn modal-confirm" onclick="confirmSell()">✅ 確認賣出</button>
      </div>
    </div>
  </div>

  <!-- EDIT STOCK MODAL -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-box">
      <div class="modal-title">✏️ 修改持股</div>
      <div class="modal-info">修改 <b id="edit-name"></b></div>
      <div class="modal-row">
        <span class="modal-label">買入價</span>

  <!-- ADD STOCK PAGE -->

        <div><div class="total-val" id="ts-realized">$0</div><div class="total-label">已實現</div></div>
        <div><div class="total-val" id="ts-unrealized">$0</div><div class="total-label">未實現</div></div>
        <div><div class="total-val" id="ts-total-pl">$0</div><div class="total-label">總損益</div></div>

<script>
// ===== CONFIG =====
const LS_KEY = 'chai_stock_session';

// ===== STATE =====
let stocks = [];
let history = [];
let sellTarget = null;
let editTarget = null;
let sessionUser = null;

// ===== TOAST =====
function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isErr ? ' err' : '');
  t.classList.add('show');
  clearTimeout(t._hide);
  t._hide = setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== API HELPER =====
async function api(path, body) {
  const opt = {headers:{'Content-Type':'application/json'}};
  if (body) opt.method = 'POST', opt.body = JSON.stringify(body);
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || '請求失敗');
  return j;
}

// ===== DATA PERSISTENCE =====
async function saveDataToServer() {
  await api('/api/data', {stocks, history});
}

async function loadDataFromServer() {
  const r = await api('/api/data');
  stocks = r.data.stocks || [];
  history = r.data.history || [];
}

// ===== SELL =====
function openSell(id) {
  sellTarget = id;
  const s = stocks[id];
  document.getElementById('sell-name').textContent = s.name + ' (' + s.code + ')';
  document.getElementById('sell-price').value = s.current_price || '';
  document.getElementById('sell-shares').value = '';
  document.getElementById('sell-profit').style.display = 'none';
  document.getElementById('sell-modal').classList.add('show');
}
function closeSell() {
  sellTarget = null;
  document.getElementById('sell-modal').classList.remove('show');
}
async function confirmSell() {
  const price = parseFloat(document.getElementById('sell-price').value);
  const shares = parseInt(document.getElementById('sell-shares').value);
  if (!price || !shares) { showToast('請填寫價格和張數', true); return; }
  const s = stocks[sellTarget];
  const cost = s.buy_price * shares * 1000;
  const revenue = price * shares * 1000;
  const fee = revenue * 0.001425;
  const tax = revenue * 0.003;
  const profit = revenue - cost - fee - tax;

  // Add sell history
  history.push({
    type: 'sell', name: s.name, code: s.code,
    sell_price: price, sell_shares: shares,
    profit: Math.round(profit),
    broker: s.broker,
    date: new Date().toLocaleString('zh-TW')
  });

  // Reduce shares
  s.shares -= shares;
  if (s.shares <= 0) {
    stocks.splice(sellTarget, 1);
  }

  await saveDataToServer();
  showToast('💰 賣出成功！獲利 $' + profit.toLocaleString());
  closeSell();
  await refreshAll();
}

// ===== EDIT =====
function openEdit(id) {
  editTarget = id;
  const s = stocks[id];
  document.getElementById('edit-name').textContent = s.name + ' (' + s.code + ')';
  document.getElementById('edit-price').value = s.buy_price;
  document.getElementById('edit-shares').value = s.shares;
  document.getElementById('edit-broker').value = s.broker || '';
  document.getElementById('edit-modal').classList.add('show');
}
function closeEdit() {
  editTarget = null;
  document.getElementById('edit-modal').classList.remove('show');
}
async function confirmEdit() {
  const price = parseFloat(document.getElementById('edit-price').value);
  const shares = parseInt(document.getElementById('edit-shares').value);
  const broker = document.getElementById('edit-broker').value.trim();
  if (!price || !shares) { showToast('請填寫價格和張數', true); return; }
  const s = stocks[editTarget];
  s.buy_price = price;
  s.shares = shares;
  s.broker = broker || '未設定';
  await saveDataToServer();
  showToast('✅ 修改成功！');
  closeEdit();
  await refreshAll();
}

// ===== ADD STOCK =====
async function addStock() {
  const name = document.getElementById('a-name').value.trim();
  const code = document.getElementById('a-code').value.trim();
  const price = parseFloat(document.getElementById('a-price').value);
  const shares = parseInt(document.getElementById('a-shares').value);
  const broker = document.getElementById('a-broker').value.trim();
  if (!name || !code || !price || !shares) { showToast('請填寫完整資料', true); return; }
  stocks.push({
    name, code, buy_price: price, shares,
    broker: broker || '未設定',
    current_price: null
  });
  history.push({
    type: 'buy', name, code, price, shares,
    broker: broker || '未設定',
    date: new Date().toLocaleString('zh-TW')
  });
  await saveDataToServer();
  showToast('✅ ' + name + ' 已加入！');
  document.getElementById('a-name').value = '';
  document.getElementById('a-code').value = '';
  document.getElementById('a-price').value = '';
  document.getElementById('a-shares').value = '';
  document.getElementById('a-broker').value = '';
  switchPage('p-port');
  await refreshAll();
}

// ===== FETCH PRICES =====
async function fetchAllPrices() {
  const btn = document.getElementById('fetch-btn');
  btn.disabled = true;
  btn.textContent = '⏳ 更新中...';
  try {
    const codes = stocks.map(s => s.code).filter(Boolean);
    if (!codes.length) { showToast('還沒有持股喔', true); btn.disabled = false; return; }
    const r = await api('/api/stock?codes=' + codes.join(','));
    let updated = 0;
    stocks.forEach(s => {
      if (r.prices[s.code]) {
        s.current_price = r.prices[s.code];
        updated++;
      }
    });
    await saveDataToServer();
    btn.textContent = '🔄 更新股價';
    showToast('🔄 股價更新完成！');
    await refreshAll();
  } catch(e) {
    btn.textContent = '🔄 更新股價';
    showToast('❌ 股價更新失敗', true);
  }
  btn.disabled = false;
}

async function manualUpdate() {
  const sel = document.getElementById('q-select');
  const price = document.getElementById('q-price');
  const idx = parseInt(sel.value);
  if (isNaN(idx) || idx < 0) { showToast('請選取股票', true); return; }
  const p = parseFloat(price.value);
  if (!p) { showToast('請輸入價格', true); return; }
  stocks[idx].current_price = p;
  await saveDataToServer();
  showToast('✅ ' + stocks[idx].name + ' 更新為 $' + p);
  price.value = '';
  sel.value = '';
  await refreshAll();
}

// ===== DELETE =====
async function deleteStock(id) {
  const s = stocks[id];
  if (!confirm('確定要刪除 ' + s.name + ' 嗎？')) return;
  stocks.splice(id, 1);
  await saveDataToServer();
  showToast('🗑️ 已刪除 ' + s.name);
  await refreshAll();
}

// ===== REFRESH UI =====
async function refreshAll() {
  await loadDataFromServer();

  // Update select
  const sel = document.getElementById('q-select');
  sel.innerHTML = '<option value="">📋 手動選取更新...</option>';
  stocks.forEach((s, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = s.name + ' (' + s.code + ')';
    sel.appendChild(o);
  });

  renderPortfolio();
  renderHistory();
  renderSummary();
}

// ===== RENDER =====
function renderPortfolio() {
  const list = document.getElementById('stock-list');
  const empty = document.getElementById('empty-port');
  list.innerHTML = '';
  if (!stocks.length) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  let tc = 0, tv = 0;
  stocks.forEach((s, i) => {
    const cost = (s.buy_price || 0) * (s.shares || 0) * 1000;
    const val = (s.current_price || 0) * (s.shares || 0) * 1000;
    tc += cost;
    tv += val;
    const p = val - cost;
    const pct = s.buy_price ? ((s.current_price||0)/s.buy_price - 1)*100 : 0;
    const isUp = p >= 0;
    const isUpPrice = (s.current_price||0) >= (s.buy_price||0);
    const card = document.createElement('div');
    card.className = 'stock-card';
    card.innerHTML = `
      <div class="stock-top">
        <div class="stock-left">
          <span class="stock-name">${s.name}<span class="stock-code">${s.code}</span></span>
        </div>
        <div class="stock-pl" style="color:${isUp?'#059669':'#dc2626'}">
          ${isUp?'🌿':'🍎'} ${p.toLocaleString()}
        </div>
      </div>
      <div class="stock-price-row">
        <span><span class="stock-price-label">現價 </span><span class="stock-price-num">$${s.current_price?.toFixed(2)||'?'}</span></span>
        <span style="font-size:12px;color:${isUp?'#059669':'#dc2626'}">${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%</span>
      </div>
      <div class="stock-info-row">
        <span>💵 買入 $${s.buy_price?.toFixed(2)}</span>
        <span>📦 ${s.shares} 張</span>
        <span>🏦 ${s.broker||'?'}</span>
      </div>
      <div class="stock-actions">
        <button class="stock-btn stock-btn-sell" onclick="openEdit(${i})">✏️ 修改</button>
        <button class="stock-btn stock-btn-sell" onclick="openSell(${i})">💰 賣出</button>
      </div>
    `;
    list.appendChild(card);
  });

  const totalPL = tv - tc;
  const pctAll = tc ? ((tv/tc - 1)*100) : 0;
  document.getElementById('total-value-display').textContent = '$' + tv.toLocaleString();
  document.getElementById('t-cost').textContent = '$' + tc.toLocaleString();
  document.getElementById('t-pl').textContent = (totalPL >= 0 ? '+' : '') + '$' + totalPL.toLocaleString();
  document.getElementById('t-pl').style.color = totalPL >= 0 ? '#059669' : '#dc2626';
  document.getElementById('t-pct').textContent = (pctAll >= 0 ? '+' : '') + pctAll.toFixed(1) + '%';
  document.getElementById('t-pct').style.color = pctAll >= 0 ? '#059669' : '#dc2626';
}

function renderHistory() {
  const list = document.getElementById('hist-list');
  const empty = document.getElementById('empty-hist');
  list.innerHTML = '';
  if (!history.length) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  history.slice().reverse().forEach(h => {
    const isBuy = h.type === 'buy';
    const card = document.createElement('div');
    card.className = 'history-card';
    const profitText = h.profit != null ? `<span class="hist-profit" style="color:${h.profit>=0?'#059669':'#dc2626'}">${h.profit>=0?'🌿':'🍎'} $${Math.abs(h.profit).toLocaleString()}</span>` : '';
    card.innerHTML = `
      <div class="hist-top">
        <div class="hist-name">${h.name} <span class="hist-type ${isBuy?'hist-buy':'hist-sell'}">${isBuy?'買入':'賣出'}</span></div>
        ${profitText}
      </div>
      <div class="hist-detail">
        <span>💵 $${(h.price||h.sell_price)?.toFixed(2)}</span>
        <span>📦 ${h.shares||h.sell_shares} 張</span>
        ${h.broker ? `<span>🏦 ${h.broker}</span>` : ''}
      </div>
      <div class="hist-date">${h.date || h.created_at || ''}</div>
    `;
    list.appendChild(card);
  });
}

function renderSummary() {
  const el = document.getElementById('broker-list');
  const empty = document.getElementById('empty-sum');
  el.innerHTML = '';
  if (!stocks.length && !history.length) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  // By broker
  const brokers = {};
  stocks.forEach(s => {
    const b = s.broker || '未設定';
    if (!brokers[b]) brokers[b] = {stocks:[], cost:0, value:0, pl:0};
    brokers[b].stocks.push(s);
    const cost = s.buy_price * s.shares * 1000;
    const val = (s.current_price || 0) * s.shares * 1000;
    brokers[b].cost += cost;
    brokers[b].value += val;
    brokers[b].pl += val - cost;
  });

  // Realized P&L from history
  let realized = 0, totalCost = 0;
  history.forEach(h => {
    if (h.type === 'buy') totalCost += (h.price||0) * (h.shares||0) * 1000;
    if (h.profit != null) realized += h.profit;
  });

  let unrealized = 0;
  stocks.forEach(s => {
    unrealized += ((s.current_price||0) - s.buy_price) * s.shares * 1000;
  });

  const totalPL = realized + unrealized;
  document.getElementById('ts-realized').textContent = '$' + realized.toLocaleString();
  document.getElementById('ts-unrealized').textContent = '$' + unrealized.toLocaleString();
  document.getElementById('ts-total-pl').textContent = (totalPL >= 0 ? '+' : '') + '$' + totalPL.toLocaleString();
  document.getElementById('ts-total-pl').style.color = totalPL >= 0 ? '#059669' : '#dc2626';
  document.getElementById('ts-total-cost').textContent = '$' + totalCost.toLocaleString();

  let roi = totalCost ? (totalPL / totalCost * 100) : 0;
  document.getElementById('ts-roi').textContent = '📊 總報酬率: ' + (roi >= 0 ? '+' : '') + roi.toFixed(2) + '%';
  document.getElementById('ts-roi').style.color = roi >= 0 ? '#059669' : '#dc2626';

  Object.keys(brokers).forEach(b => {
    const data = brokers[b];
    const card = document.createElement('div');
    card.className = 'sum-card';
    card.innerHTML = `
      <div class="sum-top">
        <span class="sum-broker">🏦 ${b}</span>
        <span class="sum-pl" style="color:${data.pl>=0?'#059669':'#dc2626'}">${data.pl>=0?'🌿':'🍎'} $${data.pl.toLocaleString()}</span>
      </div>
      <div class="sum-grid">
        <div><div class="sum-cell-val">$${data.cost.toLocaleString()}</div><div class="sum-cell-label">成本</div></div>
        <div><div class="sum-cell-val">$${data.value.toLocaleString()}</div><div class="sum-cell-label">市值</div></div>
        <div><div class="sum-cell-val">${data.stocks.length} 檔</div><div class="sum-cell-label">持股數</div></div>
      </div>
      ${data.stocks.map((s, si) => `
        <div class="stock-mini">
          <div class="stock-mini-left">
            <div class="stock-mini-name">${s.name} (${s.code})</div>
            <div class="stock-mini-info">買入 $${s.buy_price?.toFixed(2)} · ${s.shares} 張</div>
          </div>
          <button class="stock-mini-del" onclick="deleteStock(${stocks.indexOf(s)})" title="刪除">✕</button>
        </div>
      `).join('')}
    `;
    el.appendChild(card);
  });
}

// ===== PAGE SWITCH =====
function switchPage(id) {
  document.querySelectorAll('.page').forEach(p => {
    p.style.display = p.id === id ? 'flex' : 'none';
  });
  document.querySelectorAll('.ni').forEach(n => {
    n.classList.toggle('active', n.dataset.page === id);
  });
}

// ===== LOGIN =====
async function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value.trim();
  const err = document.getElementById('login-error');
  if (!user || !pass) { err.textContent = '請填寫帳號密碼'; err.style.display = 'block'; return; }
  try {
    const r = await api('/api/login', {username:user, password:pass});
    if (!r.success) { err.textContent = r.error || '登入失敗'; err.style.display = 'block'; return; }
    sessionUser = user;
    localStorage.setItem(LS_KEY, '1');
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-indicator').textContent = '🐾 ' + user;
    await refreshAll();
    err.style.display = 'none';
  } catch(e) {
    err.textContent = e.message;
    err.style.display = 'block';
  }
}

async function doRegister() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value.trim();
  const err = document.getElementById('login-error');
  if (!user || !pass) { err.textContent = '請填寫帳號密碼'; err.style.display = 'block'; return; }
  if (pass.length < 4) { err.textContent = '密碼至少4碼'; err.style.display = 'block'; return; }
  try {
    const r = await api('/api/register', {username:user, password:pass});
    if (!r.success) { err.textContent = r.error || '註冊失敗'; err.style.display = 'block'; return; }
    sessionUser = user;
    localStorage.setItem(LS_KEY, '1');
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-indicator').textContent = '🐾 ' + user;
    await refreshAll();
    err.style.display = 'none';
  } catch(e) {
    err.textContent = e.message;
    err.style.display = 'block';
  }
}

async function saveAndLogout() {
  try { await api('/api/logout', {}); } catch(e) {}
  localStorage.removeItem(LS_KEY);
  sessionUser = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-page').style.display = 'flex';
}

// ===== CHECK SESSION =====
async function checkSession() {
  try {
    const r = await api('/api/me');
    if (r.loggedIn && r.username) {
      sessionUser = r.username;
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('user-indicator').textContent = '🐾 ' + r.username;
      await refreshAll();
      return;
    }
  } catch(e) {}
  // Not logged in — show login page
}

// ===== EVENT BINDINGS =====
document.getElementById('btn-login').addEventListener('click', doLogin);
document.getElementById('btn-register').addEventListener('click', doRegister);
document.getElementById('fetch-btn').addEventListener('click', fetchAllPrices);
document.getElementById('q-btn').addEventListener('click', manualUpdate);
document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// Nav switching
document.querySelectorAll('.ni').forEach(n => {
  n.addEventListener('click', () => switchPage(n.dataset.page));
});

// ===== INIT =====
checkSession();
</script>
