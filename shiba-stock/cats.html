// === KENNEY PIXEL SPRITE SYSTEM ===
// Draw pixel art onto a temp canvas then blit scaled
const PIX=16; // base pixel size for sprites

function makeKenneySprite(pixelData, palette) {
  // pixelData: 2D array [row][col] with palette index, -1 = transparent
  return function(ctx, x, y, scale) {
    const s = scale;
    const off = s / PIX;
    for(let row=0; row<pixelData.length; row++) {
      for(let col=0; col<pixelData[row].length; col++) {
        const idx = pixelData[row][col];
        if(idx >= 0 && palette[idx]) {
          ctx.fillStyle = palette[idx];
          ctx.fillRect(x + col*off - (pixelData[0].length*off)/2, 
                        y + row*off - (pixelData.length*off)/2, off+0.5, off+0.5);
        }
      }
    }
  };
}

function drawKenneyCat(cx,cy,type,scale,hpR) {
  const s = scale;
  CAT_DRAW[type](CX, cx, cy, s);
  // Shadow
  CX.fillStyle='rgba(0,0,0,0.15)';
  CX.beginPath(); CX.ellipse(cx+2, cy+s*0.4, s*0.35, s*0.08, 0, 0, Math.PI*2); CX.fill();
  // HP bar
  if(hpR<1) {
    const bw=s*0.8, bh=s*0.12;
    CX.fillStyle='rgba(0,0,0,0.3)'; CX.fillRect(cx-bw/2, cy-s*0.55, bw, bh);
    CX.fillStyle=hpR>0.5?'#44CC44':hpR>0.25?'#FFAA00':'#FF4444';
    CX.fillRect(cx-bw/2, cy-s*0.55, bw*hpR, bh);
  }
}

function drawKenneyHusky(cx,cy,isBoss,scale,hpR) {
  const s = scale;
  if(isBoss) BOSS_HUSKY(CX, cx, cy, s);
  else NORM_HUSKY(CX, cx, cy, s);
  CX.fillStyle='rgba(0,0,0,0.15)';
  CX.beginPath(); CX.ellipse(cx+2, cy+s*0.4, s*0.35, s*0.08, 0, 0, Math.PI*2); CX.fill();

// ===== HELPERS =====
function rRect(x,y,w,h,r) {
  if(r>w/2)r=w/2;if(r>h/2)r=h/2;
  CX.beginPath(); CX.moveTo(x+r,y); CX.lineTo(x+w-r,y);
  CX.quadraticCurveTo(x+w,y,x+w,y+r); CX.lineTo(x+w,y+h-r);
  CX.quadraticCurveTo(x+w,y+h,x+w-r,y+h); CX.lineTo(x+r,y+h);
  CX.quadraticCurveTo(x,y+h,x,y+h-r); CX.lineTo(x,y+r);
  CX.quadraticCurveTo(x,y,x+r,y); CX.closePath(); CX.fill();
}

function addParticles(x,y,n,c){for(let i=0;i<n;i++)G.particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4-2,life:20+Math.random()*20,maxL:40,color:c,size:2+Math.random()*3});}

// ===== SPAWNING =====
function spawnCat(){
  const i=G.selectedCat,ct=CAT_TYPES[i];
  if(G.money<ct.cost||CAT_CD[i]>0)return;
  G.money-=ct.cost; CAT_CD[i]=ct.cd;
  const lanes=[0,1,2];
  const lane=lanes[Math.floor(Math.random()*lanes.length)];
  G.cats.push({x:65,y:355+lane*18,vx:ct.spd,hp:ct.hp,hpMax:ct.hp,atk:ct.atk,range:ct.range,atkCD:0,atkInt:35,type:i,scale:ct.scale,state:'walk',kills:0,level:1,hitFlash:0});
  addParticles(65,365,8,'#FFD700');
}

function spawnEnemy(typeIdx){
  const et=ENEMY_TYPES[typeIdx],ws=1+G.wave*0.15;
  const hp=Math.floor(et.hp*ws),atk=Math.floor(et.atk*(1+G.wave*0.08));
  const lanes=[0,1,2];
  const lane=lanes[Math.floor(Math.random()*lanes.length)];
  G.enemies.push({x:395,y:355+lane*18,vx:-et.spd,hp,hpMax:hp,atk,atkCD:0,atkInt:45,type:typeIdx,state:'walk',scale:et.scale,isBoss:et.isBoss,score:et.score,hitFlash:0});
}

// ===== WAVES =====
function startWave(){
  if(G.wave>=G.totalWaves)return;
  G.waveEnemies=[];
  for(const[t,c]of WAVES[G.wave].enemies)for(let i=0;i<c;i++)G.waveEnemies.push(t);
  for(let i=G.waveEnemies.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[G.waveEnemies[i],G.waveEnemies[j]]=[G.waveEnemies[j],G.waveEnemies[i]];}
  G.waveProgress=0;G.waveState='spawning';G.spawnTimer=0;
}

// ===== UPDATE =====
function update(){
  if(G.pause||G.scene!=='playing')return;
  G.frame++;
  G.energy=Math.min(G.maxEnergy,G.energy+G.energyRegen);
  G.money=Math.min(9999,G.money+G.moneyRegen);
  for(let i=0;i<CAT_TYPES.length;i++)if(CAT_CD[i]>0)CAT_CD[i]--;

  // Waves
  if(G.waveState==='idle'){G.waveTimer++;if(G.waveTimer>120){G.waveTimer=0;startWave();}}
  else if(G.waveState==='spawning'){
    G.spawnTimer++;
    if(G.spawnTimer>=Math.max(25,55-G.wave*2)&&G.waveProgress<G.waveEnemies.length){
      G.spawnTimer=0;spawnEnemy(G.waveEnemies[G.waveProgress]);G.waveProgress++;
    }
    if(G.waveProgress>=G.waveEnemies.length&&G.enemies.length===0){
      G.waveState='idle';G.waveTimer=0;
      G.money=Math.min(9999,G.money+WAVES[G.wave].reward);
      G.enemyBaseHp-=300;if(G.enemyBaseHp<0)G.enemyBaseHp=0;
      addParticles(385,365,25,'#FF4444');G.wave++;
      if(G.wave>=G.totalWaves)G.waveState='final';
    }
  }
  else if(G.waveState==='final'){
    for(let i=G.cats.length-1;i>=0;i--){
      const c=G.cats[i];c.vx=CAT_TYPES[c.type].spd*0.8;c.x+=c.vx;
      if(c.x>385){G.enemyBaseHp-=c.atk*2;addParticles(385,365,8,'#FF6B35');G.cats.splice(i,1);if(G.enemyBaseHp<=0){G.enemyBaseHp=0;G.scene='win';G.gameWon=true;}}
    }
  }

  // === CATS ===
  for(let i=G.cats.length-1;i>=0;i--){
    const c=G.cats[i];
    if(c.hitFlash>0)c.hitFlash--;
    if(c.state==='dead'){G.cats.splice(i,1);continue;}
    let target=null,md=999;
    G.enemies.forEach(e=>{const d=e.x-c.x;if(d>0&&d<md){md=d;target=e;}});
    if(target&&md<Math.max(c.range+10,35)){
      c.vx=0;c.atkCD--;
      if(c.atkCD<=0){c.atkCD=c.atkInt;target.hp-=c.atk;target.hitFlash=6;addParticles(target.x,target.y-5,6,'#FFD700');
        G.dmgTexts.push({x:target.x,y:target.y-15,text:'-'+c.atk,life:20,color:'#FF4444'});
        if(target.hp<=0){
          const idx=G.enemies.indexOf(target);
          if(idx>-1){
            G.money=Math.min(9999,G.money+ENEMY_TYPES[target.type].score*2);
            G.enemiesKilled++;c.kills++;
            if(c.kills%5===0&&c.level<5){
              c.level++;c.atk=Math.floor(c.atk*1.2);c.hpMax=Math.floor(c.hpMax*1.15);c.hp=c.hpMax;
              addParticles(c.x,c.y-15,15,'#00FF88');
            }
            G.enemies.splice(idx,1);addParticles(target.x,target.y,12,target.type===5?'#FF4444':'#FFD700');
          }
        }
      }
    } else {c.vx=CAT_TYPES[c.type].spd;c.x+=c.vx;}
    if(c.x>390){G.enemyBaseHp-=c.atk*0.4;if(G.enemyBaseHp<0)G.enemyBaseHp=0;addParticles(390,365,8,'#FF6B35');G.cats.splice(i,1);if(G.enemyBaseHp<=0&&!G.gameWon){G.scene='win';G.gameWon=true;}}
    if(c.hp<=0){addParticles(c.x,c.y,10,'#FF6666');G.catsKilled++;G.cats.splice(i,1);}
  }

  // === ENEMIES ===
  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i];
    if(e.hitFlash>0)e.hitFlash--;
    let target=null,md=999;
    G.cats.forEach(c=>{const d=c.x-e.x;if(d>0&&d<md){md=d;target=c;}});
    if(target&&md<35){
      e.vx=0;e.atkCD--;
      if(e.atkCD<=0){e.atkCD=e.atkInt;target.hp-=e.atk;target.hitFlash=6;
        G.dmgTexts.push({x:target.x,y:target.y-15,text:'-'+e.atk,life:20,color:'#FF8888'});
        if(target.hp<=0){target.state='dead';G.catsKilled++;addParticles(target.x,target.y,10,'#FF6666');}}
    } else {e.vx=-(ENEMY_TYPES[e.type]?ENEMY_TYPES[e.type].spd:1.5);e.x+=e.vx;}
    if(e.x<35){G.baseHp-=e.atk;if(G.baseHp<0)G.baseHp=0;G.enemies.splice(i,1);addParticles(35,365,8,'#FF4444');}
  }

  // Particles + damage texts
  for(let i=G.particles.length-1;i>=0;i--){const p=G.particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;if(p.life<=0)G.particles.splice(i,1);}
  for(let i=G.dmgTexts.length-1;i>=0;i--){const d=G.dmgTexts[i];d.y-=1;d.life--;if(d.life<=0)G.dmgTexts.splice(i,1);}

  if(G.baseHp<=0)G.scene='gameover';
  if(G.enemyBaseHp<=0&&!G.gameWon){G.scene='win';G.gameWon=true;}
}

function drawBG(){
  const g=CX.createLinearGradient(0,0,0,500);
  g.addColorStop(0,'#A8D8FF');g.addColorStop(.5,'#C8E8FF');g.addColorStop(1,'#FFE0B8');
  CX.fillStyle=g;CX.fillRect(0,0,W,500);
  CX.fillStyle='rgba(255,255,255,.6)';
  [[60,70,25],[170,50,20],[360,80,22],[90,120,18],[400,60,24]].forEach(([cx,cy,r])=>{
    const ox=Math.sin(G.frame*0.002+cx)*15;
    CX.beginPath();CX.arc(cx+ox,cy,r,0,Math.PI*2);CX.fill();
    CX.beginPath();CX.arc(cx+ox+r*.8,cy-r*.3,r*.7,0,Math.PI*2);CX.fill();
    CX.beginPath();CX.arc(cx+ox+r*1.2,cy+r*.2,r*.8,0,Math.PI*2);CX.fill();
  });
  CX.fillStyle='#80C060';CX.fillRect(0,420,W,280);
  CX.fillStyle='#70A850';CX.fillRect(0,420,W,4);
  for(let x=0;x<W;x+=8)CX.fillRect(x,420,2,3+Math.sin(x*.3)*3);
}

function drawBattlefield(){
  // Single path - one lane
  CX.fillStyle='#C8A060';CX.fillRect(60,340,380,80);
  CX.fillStyle='#B89050';for(let x=60;x<440;x+=20)CX.fillRect(x,340,2,80);
  // Borders
  CX.fillStyle='#A08040';CX.fillRect(60,339,380,3);CX.fillRect(60,417,380,3);

  // Player base
  CX.fillStyle='#8B5E3C';rRect(4,320,66,85,8);CX.fillStyle='#A07050';rRect(2,315,70,10,4);
  CX.font='32px sans-serif';CX.textAlign='center';CX.textBaseline='middle';
  CX.fillText('🐱',37,362);
  // Enemy base
  CX.fillStyle='#404050';rRect(410,320,66,85,8);CX.fillStyle='#505060';rRect(408,315,70,10,4);
  CX.fillText('🐶',443,362);

  // HP
  CX.fillStyle='rgba(0,0,0,.5)';rRect(8,298,68,22,6);
  CX.fillStyle='#44FF44';CX.font='bold 10px sans-serif';CX.textAlign='center';
  CX.fillText('🏠'+Math.ceil(G.baseHp),42,313);
  CX.fillStyle='rgba(0,0,0,.5)';rRect(404,298,68,22,6);
  CX.fillStyle='#FF4444';CX.font='bold 10px sans-serif';
  CX.fillText('🏢'+Math.ceil(G.enemyBaseHp),438,313);
}

function drawUI(){
  CX.fillStyle='rgba(0,0,0,.55)';rRect(4,4,W-8,34,10);
  CX.fillStyle='#FFD700';CX.font='bold 11px sans-serif';CX.textAlign='left';
  CX.fillText('⚡'+Math.floor(G.energy),12,26);
  CX.fillStyle='rgba(255,255,255,.15)';rRect(65,10,80,8,4);
  CX.fillStyle='#FFD700';rRect(65,10,80*(G.energy/G.maxEnergy),8,4);
  CX.textAlign='center';CX.fillText('💰'+Math.floor(G.money),185,26);
  CX.fillStyle='#FFF';CX.font='bold 11px sans-serif';CX.textAlign='center';
  CX.fillText('Wave '+(G.wave+1)+'/'+G.totalWaves+' · '+(G.wave<G.totalWaves?WAVES[G.wave].desc:'最終突襲'),290,26);
  CX.fillStyle='#8F8';CX.font='9px sans-serif';CX.textAlign='right';
  CX.fillText('🐱'+G.cats.length+' vs 🐶'+G.enemies.length,W-12,16);
  CX.fillText('K:'+G.enemiesKilled,W-12,30);

  if(G.waveState==='idle'&&G.waveTimer>0&&G.waveTimer<100){
    CX.globalAlpha=G.waveTimer<30?G.waveTimer/30:1;
    CX.fillStyle='rgba(0,0,0,.35)';rRect(140,150,200,50,12);
    CX.fillStyle='#FFF';CX.font='bold 16px sans-serif';CX.textAlign='center';
    CX.fillText('⚔️ '+(G.wave<G.totalWaves?WAVES[G.wave].desc:'最終決戰!'),240,182);
    CX.globalAlpha=1;
  }

  // Bottom cat bar
  CX.fillStyle='rgba(0,0,0,.45)';rRect(6,620,W-12,92,12);
  const bw=63,startX=12;
  for(let i=0;i<CAT_TYPES.length;i++){
    const ct=CAT_TYPES[i],bx=startX+i*(bw+2),ok=G.money>=ct.cost&&CAT_CD[i]<=0;
    CX.fillStyle=i===G.selectedCat?'rgba(255,215,0,.35)':'rgba(255,255,255,.08)';
    rRect(bx,626,bw,78,6);
    // Mini Kenney cat icon
    CAT_DRAW[i](CX,bx+bw/2,656,18);
    CX.fillStyle=ok?'#FFD700':'#FF6666';CX.font='bold 8px sans-serif';CX.textAlign='center';
    CX.fillText('💰'+ct.cost,bx+bw/2,684);
    if(CAT_CD[i]>0){CX.fillStyle='rgba(0,0,0,.55)';rRect(bx,626,bw,78,6);CX.fillStyle='#FFF';CX.font='bold 14px sans-serif';CX.fillText(Math.ceil(CAT_CD[i]/60),bx+bw/2,664);}
    if(i===G.selectedCat){CX.strokeStyle='#FFD700';CX.lineWidth=2;CX.beginPath();CX.roundRect(bx,626,bw,78,6);CX.stroke();}
    CX.fillStyle='rgba(255,255,255,.35)';CX.font='8px sans-serif';CX.fillText(i+1,bx+bw/2,638);
  }
  CX.fillStyle='#FFF';CX.font='bold 9px sans-serif';CX.textAlign='center';
  CX.fillText(CAT_TYPES[G.selectedCat].name+' · '+CAT_TYPES[G.selectedCat].desc,W/2,714);
}

  CX.fillStyle=g;CX.fillRect(0,0,W,H);
  for(let i=0;i<7;i++){CAT_DRAW[i](CX,35+i*62,380+Math.sin(G.frame*.02+i)*30,20);CX.fillStyle='rgba(0,0,0,.15)';CX.beginPath();CX.ellipse(35+i*62+2,395+Math.sin(G.frame*.02+i)*30,18,4,0,0,Math.PI*2);CX.fill();}
  CX.fillStyle='rgba(0,0,0,.55)';rRect(30,80,W-60,155,20);
  CX.fillStyle='#FFD700';CX.font='bold 34px sans-serif';CX.textAlign='center';
  CX.fillText('🐱 橘犬不寧',W/2,125);
  CX.fillStyle='#FFF';CX.font='bold 16px sans-serif';CX.fillText('～ 貓皇軍團 vs CEO二哈 ～',W/2,158);
  CX.font='12px sans-serif';CX.fillStyle='#CCC';CX.fillText('7種橘貓兵種 · 10波攻防 · Kenney像素風格',W/2,190);
  CX.fillStyle='#AAA';CX.font='10px sans-serif';CX.fillText('保護城堡 · 擊敗CEO · 一條路正面對決！',W/2,215);
  CX.fillStyle='#FF6B35';rRect(W/2-116,275,232,50,25);
  CX.fillStyle='rgba(255,255,255,.2)';rRect(W/2-116,275,232,25,25);
  CX.fillStyle='#FFF';CX.font='bold 18px sans-serif';CX.fillText('▶ 開始戰鬥',W/2,306);
  CX.fillStyle='rgba(0,0,0,.4)';rRect(30,455,W-60,220,14);
  CX.fillStyle='#FFF';CX.font='11px sans-serif';CX.textAlign='left';
  ['🐱 7種不同橘貓！每種都有獨特造型','🐶 CEO二哈軍團：10波逐步升級','⚡ 能量回滿 · 💰 殺敵賺金幣打魔王',
   '🚫 不能穿過敵人！正面對撞才夠硬','🏆 摧毀CEO大樓 = 通關勝利！','⌨ 點擊選貓 | 點戰場出擊 | P暫停'
  ].forEach((t,i)=>CX.fillText(t,50,490+i*30));
  CX.fillStyle='rgba(255,255,255,.3)';CX.font='10px sans-serif';CX.textAlign='center';
  CX.fillText('🎨 像素Kenney風格 · 點擊開始',W/2,700);
}

function drawOverlay(){
  if(G.scene==='gameover'){
    CX.fillStyle='rgba(0,0,0,.65)';CX.fillRect(0,0,W,H);
    CX.fillStyle='#FF4444';CX.font='bold 42px sans-serif';CX.textAlign='center';
    CX.fillText('💀 戰敗',W/2,240);CX.fillStyle='#FFF';CX.font='17px sans-serif';
    CX.fillText('城堡被CEO二哈攻陷了...',W/2,290);
    CX.fillText('第'+(G.wave+1)+'波 · 擊殺'+G.enemiesKilled+'隻',W/2,325);
    CX.fillStyle='#AAA';CX.font='14px sans-serif';CX.fillText('點擊重新挑戰',W/2,380);
  } else if(G.scene==='win'){
    CX.fillStyle='rgba(0,0,0,.65)';CX.fillRect(0,0,W,H);
    CX.fillStyle='#FFD700';CX.font='bold 42px sans-serif';CX.fillText('🏆 勝利！',W/2,220);
    CX.fillStyle='#FFF';CX.font='18px sans-serif';CX.fillText('橘貓大帝擊敗了CEO哈士奇！',W/2,270);
    CX.fillStyle='#8F8';CX.fillText('🎉 '+G.wave+'波全通 · 擊殺'+G.enemiesKilled+'隻',W/2,310);
    CX.fillStyle='#AAA';CX.font='14px sans-serif';CX.fillText('點擊再戰一局',W/2,380);
  }
}

function render(){
  CX.clearRect(0,0,W,H);
  if(G.scene==='menu'){drawMenu();return;}
  drawBG();drawBattlefield();
  G.cats.forEach(c=>{
    if(c.hitFlash>0){CX.save();CX.globalAlpha=.4;CX.fillStyle='#FFF';CX.beginPath();CX.arc(c.x+3,c.y-3,CAT_TYPES[c.type].scale*.5,0,Math.PI*2);CX.fill();CX.restore();}
    drawKenneyCat(c.x,c.y,c.type,c.scale,c.hp/c.hpMax);
  });
  G.enemies.forEach(e=>{
    if(e.hitFlash>0){CX.save();CX.globalAlpha=.5;CX.fillStyle='#FFF';CX.beginPath();CX.arc(e.x,e.y,e.scale*.6,0,Math.PI*2);CX.fill();CX.restore();}
    drawKenneyHusky(e.x,e.y,e.isBoss,e.scale,e.hp/e.hpMax);
  });
  G.dmgTexts.forEach(d=>{CX.globalAlpha=d.life/20;CX.fillStyle=d.color;CX.font='bold 14px sans-serif';CX.textAlign='center';CX.fillText(d.text,d.x,d.y);});
  CX.globalAlpha=1;
  G.particles.forEach(p=>{CX.globalAlpha=p.life/p.maxL;CX.fillStyle=p.color;CX.beginPath();CX.arc(p.x,p.y,p.size,0,Math.PI*2);CX.fill()});
  CX.globalAlpha=1;drawUI();drawOverlay();
}

function gameLoop(){if(G.scene==='playing')update();render();requestAnimationFrame(gameLoop)}
function resetGame(){
  G.cats=[];G.enemies=[];G.particles=[];G.dmgTexts=[];
  G.money=600;G.energy=60;G.frame=0;G.baseHp=3000;G.maxBaseHp=3000;
  G.enemyBaseHp=3000;G.maxEnemyBaseHp=3000;
  G.wave=0;G.waveEnemies=[];G.waveProgress=0;G.waveState='idle';G.waveTimer=60;
  G.spawnTimer=0;G.catsKilled=0;G.enemiesKilled=0;G.gameWon=false;
  for(let i=0;i<CAT_TYPES.length;i++)CAT_CD[i]=0;
}

document.addEventListener('keydown',e=>{
  if(e.key==='p'||e.key==='P')G.pause=!G.pause;
  if(e.key>='1'&&e.key<='7')G.selectedCat=parseInt(e.key)-1;
  if(e.key===' '&&G.scene==='playing'){e.preventDefault();spawnCat();}
  if(e.key===' '||e.key==='Enter'){if(G.scene==='menu'){G.scene='playing';resetGame();}else if(G.scene==='gameover'||G.scene==='win'){G.scene='menu';}}
});

GC.addEventListener('click',e=>{
  const r=GC.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  if(G.scene==='menu'||G.scene==='gameover'||G.scene==='win'){G.scene='playing';resetGame();return;}

  for(let i=0;i<7;i++){const bx=12+i*(bw+2);if(y>620&&y<712&&x>bx&&x<bx+bw&&G.money>=CAT_TYPES[i].cost&&CAT_CD[i]<=0){G.selectedCat=i;spawnCat();return;}}
  if(x>60&&x<420&&y>75&&y<620)spawnCat();
});

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(r>w/2)r=w/2;if(r>h/2)r=h/2;
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);return this;
  };
}
gameLoop();
