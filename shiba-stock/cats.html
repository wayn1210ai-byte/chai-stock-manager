<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🐱 橘犬不寧 TD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI','Noto Sans TC',sans-serif;overflow:hidden}
#wrap{position:relative;width:480px;background:linear-gradient(180deg,#ffe4b5,#fff0db);border-radius:24px;padding:4px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
canvas{display:block;width:480px;height:720px;border-radius:20px;background:#c8e6ff;margin:0 auto;cursor:pointer;touch-action:none}
@media(max-width:500px){
  #wrap{width:100vw;border-radius:0;padding:0}
  canvas{width:100vw;height:calc(100vw*720/480);border-radius:0}
}
</style>
</head>
<body>
<div id="wrap"><canvas id="gc" width="480" height="720"></canvas></div>
<script>
const GC=document.getElementById('gc'),CX=GC.getContext('2d');
const W=480,H=720;

// ===== GAME STATE =====
const G={
  scene:'menu', money:600, energy:60, maxEnergy:100,
  energyRegen:0.08, moneyRegen:0.5,
  baseHp:3000, maxBaseHp:3000,
  enemyBaseHp:3000, maxEnemyBaseHp:3000,
  frame:0, cats:[], enemies:[], particles:[], dmgTexts:[],
  wave:0, waveEnemies:[], waveProgress:0, waveState:'idle',
  waveTimer:60, spawnTimer:0, selectedCat:0, pause:false,
  totalWaves:10, catsKilled:0, enemiesKilled:0, gameWon:false,

  // Lane queue system - single file!
  catQueue:[],  // cats waiting behind front line
  enemyQueue:[] // enemies waiting behind front line
};

// ===== CAT TYPES - COMPLETELY DIFFERENT DESIGNS =====
const CAT_TYPES=[
  {name:'小橘貓', cost:80,  hp:400, atk:40,  spd:2.0, cd:90,  w:28, h:16, desc:'基本步兵'},
  {name:'金冠貓', cost:150, hp:1800,atk:15,  spd:1.3, cd:150, w:36, h:24, desc:'肉盾坦克'},
  {name:'圍兜貓', cost:250, hp:350, atk:130, spd:1.6, cd:120, w:28, h:18, desc:'近戰輸出'},
  {name:'招財貓', cost:400, hp:500, atk:180, spd:1.0, cd:180, w:26, h:20, desc:'遠程射手'},
  {name:'虎斑貓', cost:350, hp:300, atk:80,  spd:4.0, cd:80,  w:26, h:16, desc:'高速突擊'},
  {name:'飛天貓', cost:600, hp:250, atk:220, spd:2.5, cd:200, w:28, h:18, desc:'精準打擊'},
  {name:'貓皇帝', cost:1200,hp:2500,atk:600, spd:1.8, cd:400, w:40, h:30, desc:'終極戰力'}
];
const CAT_CD=new Array(CAT_TYPES.length).fill(0);

const ENEMY_TYPES=[
  {name:'實習二哈', hp:200, atk:20, spd:1.6, score:10, w:26, h:16},
  {name:'經理二哈', hp:500, atk:40, spd:2.0, score:25, w:28, h:18},
  {name:'副總二哈', hp:1000,atk:60, spd:1.3, score:50, w:30, h:20},
  {name:'執行二哈', hp:1500,atk:120,spd:1.0, score:80, w:32, h:20},
  {name:'變種二哈', hp:3000,atk:200,spd:0.8, score:150,w:34, h:22},
  {name:'CEO大魔王', hp:8000,atk:400,spd:0.6, score:500,w:48, h:36}
];

const WAVES=[
  {enemies:[[0,5]],                   reward:100, desc:'實習生來襲'},
  {enemies:[[0,4],[1,2]],             reward:150, desc:'經理加入'},
  {enemies:[[0,3],[1,3],[2,1]],       reward:200, desc:'副總登場'},
  {enemies:[[1,4],[2,2],[3,1]],       reward:300, desc:'執行官'},
  {enemies:[[0,5],[2,3],[3,2]],       reward:350, desc:'混合軍'},
  {enemies:[[1,3],[3,3],[4,1]],       reward:450, desc:'變種出擊'},
  {enemies:[[0,6],[2,4],[3,2],[4,2]], reward:500, desc:'全面進攻'},
  {enemies:[[2,4],[3,3],[4,3]],       reward:600, desc:'精銳部隊'},
  {enemies:[[3,4],[4,4],[5,1]],       reward:800, desc:'CEO護衛'},
  {enemies:[[5,1]],                   reward:1000,desc:'👑 CEO魔王'}
];

// ===== DRAWING HELPERS =====
function rRect(x,y,w,h,r){if(r>w/2)r=w/2;if(r>h/2)r=h/2;
  CX.beginPath();CX.moveTo(x+r,y);CX.lineTo(x+w-r,y);
  CX.quadraticCurveTo(x+w,y,x+w,y+r);CX.lineTo(x+w,y+h-r);
  CX.quadraticCurveTo(x+w,y+h,x+w-r,y+h);CX.lineTo(x+r,y+h);
  CX.quadraticCurveTo(x,y+h,x,y+h-r);CX.lineTo(x,y+r);
  CX.quadraticCurveTo(x,y,x+r,y);CX.closePath();CX.fill();
}
function addParticles(x,y,n,c){for(let i=0;i<n;i++)G.particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4-2,life:15+Math.random()*15,maxL:30,color:c,size:2+Math.random()*3});}

// ===== Kenney FLAT-style drawing - COMPLETELY DISTINCT per unit =====

/* --- 小橘貓: tiny round kitten --- */
function drawCat0(cx,cy,w,h,hpR){
  const s=h;
  CX.fillStyle='#FFA451';
  CX.beginPath();CX.arc(cx,cy,s*0.5,0,Math.PI*2);CX.fill();
  CX.fillStyle='#FF8C42';
  CX.beginPath();CX.moveTo(cx-s*0.45,cy-s*0.8);CX.lineTo(cx-s*0.35,cy-s*1.2);CX.lineTo(cx-s*0.15,cy-s*0.7);CX.fill();
  CX.beginPath();CX.moveTo(cx+s*0.45,cy-s*0.8);CX.lineTo(cx+s*0.35,cy-s*1.2);CX.lineTo(cx+s*0.15,cy-s*0.7);CX.fill();
  CX.fillStyle='#FFF';CX.beginPath();CX.arc(cx-s*0.2,cy-s*0.05,s*0.18,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(cx+s*0.2,cy-s*0.05,s*0.18,0,Math.PI*2);CX.fill();
  CX.fillStyle='#333';CX.beginPath();CX.arc(cx-s*0.2,cy-s*0.05,s*0.09,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(cx+s*0.2,cy-s*0.05,s*0.09,0,Math.PI*2);CX.fill();
  CX.fillStyle='#FF7FAA';
  CX.beginPath();CX.moveTo(cx-s*0.06,cy+s*0.12);CX.lineTo(cx+s*0.06,cy+s*0.12);CX.lineTo(cx,cy+s*0.18);CX.fill();
  drawHP(cx,cy-s*0.8,w,hpR);
}

/* --- 金冠貓: big shield tank with BIG gold crown --- */
function drawCat1(cx,cy,w,h,hpR){
  const s=h;
  CX.fillStyle='#FFA451';
  rRect(cx-s*0.5,cy-s*0.4,w,s*0.65,s*0.15);
  CX.fillStyle='#FF8C42';
  CX.beginPath();CX.arc(cx,cy-s*0.5,s*0.4,0,Math.PI*2);CX.fill();
  // BIG gold crown
  CX.fillStyle='#FFD700';
  CX.beginPath();CX.moveTo(cx-s*0.5,cy-s*0.6);CX.lineTo(cx-s*0.5,cy-s*1.2);
  CX.lineTo(cx-s*0.32,cy-s*0.9);CX.lineTo(cx-s*0.15,cy-s*1.25);
  CX.lineTo(cx,cy-s*0.9);CX.lineTo(cx+s*0.15,cy-s*1.25);
  CX.lineTo(cx+s*0.32,cy-s*0.9);CX.lineTo(cx+s*0.5,cy-s*1.2);
  CX.lineTo(cx+s*0.5,cy-s*0.6);CX.fill();
  CX.fillStyle='#FF4444';
  CX.beginPath();CX.arc(cx-s*0.2,cy-s*1.0,s*0.05,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(cx,cy-s*1.05,s*0.05,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(cx+s*0.2,cy-s*1.0,s*0.05,0,Math.PI*2);CX.fill();
  // Shield body
  CX.fillStyle='#D48030';
  rRect(cx-s*0.4,cy+s*0.05,w*0.8,s*0.25,s*0.06);
  CX.fillStyle='#FFE0B0';
  CX.font='bold '+(s*0.25)+'px sans-serif';CX.textAlign='center';CX.textBaseline='middle';
  CX.fillText('盾',cx,cy+s*0.17);
  // Eyes
  CX.fillStyle='#FFF';CX.beginPath();CX.arc(cx-s*0.16,cy-s*0.5,s*0.12,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(cx+s*0.16,cy-s*0.5,s*0.12,0,Math.PI*2);CX.fill();
  CX.fillStyle='#333';CX.beginPath();CX.arc(cx-s*0.16,cy-s*0.5,s*0.06,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(cx+s*0.16,cy-s*0.5,s*0.06,0,Math.PI*2);CX.fill();
  drawHP(cx,cy-s*0.65,w,hpR);
}

/* --- 圍兜貓: blue armored warrior --- */
function drawCat2(cx,cy,w,h,hpR){
  const s=h;
  CX.fillStyle='#FFA451';
  rRect(cx-s*0.45,cy-s*0.3,w*0.9,s*0.55,s*0.12);
  CX.beginPath();CX.arc(cx,cy-s*0.45,s*0.38,0,Math.PI*2);CX.fill();
  // Blue armor bib
  CX.fillStyle='#1E90FF';
  rRect(cx-s*0.3,cy-s*0.15,w*0.6,s*0.35,s*0.06);
  CX.fillStyle='#4169E1';
  CX.font='bold '+(s*0.22)+'px sans-serif';CX.textAlign='center';CX.textBaseline='middle';
  CX.fillText('戰',cx,cy+s*0.02);
  // Ears
  CX.fillStyle='#FF8C42';
  CX.beginPath();CX.moveTo(cx-s*0.35,cy-s*0.6);CX.lineTo(cx-s*0.3,cy-s*1.0);CX.lineTo(cx-s*0.1,cy-s*0.55);CX.fill();
  CX.beginPath();CX.moveTo(cx+s*0.35,cy-s*0.6);CX.lineTo(cx+s*0.3,cy-s*1.0);CX.lineTo(cx+s*0.1,cy-s*0.55);CX.fill();
  // Angry eyes
  CX.fillStyle='#FFF';CX.beginPath();CX.ellipse(cx-s*0.15,cy-s*0.45,s*0.1,s*0.08,0,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.ellipse(cx+s*0.15,cy-s*0.45,s*0.1,s*0.08,0,0,Math.PI*2);CX.fill();
  CX.fillStyle='#333';CX.beginPath();CX.arc(cx-s*0.15,cy-s*0.45,s*0.05,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(cx+s*0.15,cy-s*0.45,s*0.05,0,Math.PI*2);CX.fill();
  drawHP(cx,cy-s*0.55,w,hpR);
}

/* --- 招財貓: gold coin mage --- */
function drawCat3(cx,cy,w,h,hpR){
  const s=h;
  CX.fillStyle='#FFA451';
  CX.beginPath();CX.arc(cx,cy-s*0.1,s*0.5,0,Math.PI*2);CX.fill();
  // Gold coin aura
  CX.fillStyle='rgba(255,215,0,0.3)';
  CX.beginPath();CX.arc(cx,cy-s*0.05,s*0.7,0,Math.PI*2);CX.fill();
  // Coin
  CX.fillStyle='#FFD700';
  CX.beginPath();CX.arc(cx,cy+s*0.2,s*0.18,0,Math.PI*2);CX.fill();
  CX.fillStyle='#DAA520';
  CX.font='bold '+(s*0.18)+'px sans-serif';CX.textAlign='center';CX.textBaseline='middle';
  CX.fillText('$',cx,cy+s*0.22);
  // Ears
  CX.fillStyle='#FF8C42';
  CX.beginPath();CX.moveTo(cx-s*0.35,cy-s*0.5);CX.lineTo(cx-s*0.3,cy-s*0.9);CX.lineTo(cx-s*0.1,cy-s*0.45);CX.fill();
  CX.beginPath();CX.moveTo(cx+s*0.35,cy-s*0.5);CX.lineTo(cx+s*0.3,cy-s*0.9);CX.lineTo(cx+s*0.1,cy-s*0.45);CX.fill();
  // Eyes
  CX.fillStyle='#FFF';CX.beginPath();CX.arc(cx-s*0.16,cy-s*0.15,s*0.12,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(cx+s*0.16,cy-s*0.15,s*0.12,0,Math.PI*2);CX.fill();
  CX.fillStyle='#333';CX.beginPath();CX.arc(cx-s*0.16,cy-s*0.15,s*0.06,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(cx+s*0.16,cy-s*0.15,s*0.06,0,Math.PI*2);CX.fill();
  drawHP(cx,cy-s*0.65,w,hpR);
}

/* --- 虎斑貓: lean stripe ninja --- */
function drawCat4(cx,cy,w,h,hpR){
  const s=h;
  CX.fillStyle='#FF8C42';
  rRect(cx-s*0.4,cy-s*0.25,w*0.8,s*0.5,s*0.1);
  // Tiger stripes
  CX.fillStyle='#D46020';
  for(let i=-2;i<=2;i++)CX.fillRect(cx+i*s*0.12,cy-s*0.1,s*0.06,s*0.3);
  CX.beginPath();CX.arc(cx,cy-s*0.4,s*0.35,0,Math.PI*2);CX.fill();
  // Ninja headband
  CX.fillStyle='#FF4444';
  CX.fillRect(cx-s*0.35,cy-s*0.5,w*0.7,s*0.08);
  // Ears
  CX.fillStyle='#D46020';
  CX.beginPath();CX.moveTo(cx-s*0.3,cy-s*0.55);CX.lineTo(cx-s*0.28,cy-s*0.9);CX.lineTo(cx-s*0.08,cy-s*0.5);CX.fill();
  CX.beginPath();CX.moveTo(cx+s*0.3,cy-s*0.55);CX.lineTo(cx+s*0.28,cy-s*0.9);CX.lineTo(cx+s*0.08,cy-s*0.5);CX.fill();
  // Eyes
  CX.fillStyle='#FFF';CX.beginPath();CX.ellipse(cx-s*0.14,cy-s*0.38,s*0.09,s*0.06,0,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.ellipse(cx+s*0.14,cy-s*0.38,s*0.09,s*0.06,0,0,Math.PI*2);CX.fill();
  CX.fillStyle='#333';CX.beginPath();CX.arc(cx-s*0.14,cy-s*0.38,s*0.05,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(cx+s*0.14,cy-s*0.38,s*0.05,0,Math.PI*2);CX.fill();
  drawHP(cx,cy-s*0.55,w,hpR);
}

/* --- 飛天貓: angel with wings --- */
function drawCat5(cx,cy,w,h,hpR){
  const s=h;
  // Wings
  CX.fillStyle='#E8E8F0';
  CX.beginPath();CX.ellipse(cx-s*0.5,cy-s*0.1,s*0.35,s*0.2,-0.3,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.ellipse(cx+s*0.5,cy-s*0.1,s*0.35,s*0.2,0.3,0,Math.PI*2);CX.fill();
  // Halo
  CX.fillStyle='#FFD700';
  CX.beginPath();CX.arc(cx,cy-s*0.7,s*0.12,0,Math.PI);CX.stroke();
  CX.strokeStyle='#FFD700';CX.lineWidth=2;
  // Body
  CX.fillStyle='#D48030';
  CX.beginPath();CX.arc(cx,cy,s*0.45,0,Math.PI*2);CX.fill();
  // Ears
  CX.fillStyle='#FF8C42';
  CX.beginPath();CX.moveTo(cx-s*0.3,cy-s*0.5);CX.lineTo(cx-s*0.25,cy-s*0.85);CX.lineTo(cx-s*0.08,cy-s*0.45);CX.fill();
  CX.beginPath();CX.moveTo(cx+s*0.3,cy-s*0.5);CX.lineTo(cx+s*0.25,cy-s*0.85);CX.lineTo(cx+s*0.08,cy-s*0.45);CX.fill();
  // Eyes
  CX.fillStyle='#9370DB';
  CX.beginPath();CX.ellipse(cx-s*0.14,cy-s*0.05,s*0.08,s*0.1,0,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.ellipse(cx+s*0.14,cy-s*0.05,s*0.08,s*0.1,0,0,Math.PI*2);CX.fill();
  CX.fillStyle='#FFF';CX.beginPath();CX.arc(cx-s*0.14,cy-s*0.07,s*0.04,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(cx+s*0.14,cy-s*0.07,s*0.04,0,Math.PI*2);CX.fill();
  drawHP(cx,cy-s*0.6,w,hpR);
}

/* --- 貓皇帝: emperor with red cape + grand crown --- */
function drawCat6(cx,cy,w,h,hpR){
  const s=h;
  // Red cape
  CX.fillStyle='#8B0000';
  CX.beginPath();CX.moveTo(cx-s*0.4,cy-s*0.4);CX.quadraticCurveTo(cx-s*0.7,cy+s*0.2,cx,cy+s*0.4);CX.quadraticCurveTo(cx+s*0.7,cy+s*0.2,cx+s*0.4,cy-s*0.4);CX.fill();
  // Body
  CX.fillStyle='#FFD700';
  CX.beginPath();CX.arc(cx,cy-s*0.1,s*0.4,0,Math.PI*2);CX.fill();
  // Grand crown
  CX.fillStyle='#FFD700';
  CX.beginPath();CX.moveTo(cx-s*0.5,cy-s*0.4);CX.lineTo(cx-s*0.5,cy-s*1.1);
  CX.lineTo(cx-s*0.35,cy-s*0.8);CX.lineTo(cx-s*0.2,cy-s*1.2);
  CX.lineTo(cx,cy-s*0.8);CX.lineTo(cx+s*0.2,cy-s*1.2);
  CX.lineTo(cx+s*0.35,cy-s*0.8);CX.lineTo(cx+s*0.5,cy-s*1.1);
  CX.lineTo(cx+s*0.5,cy-s*0.4);CX.fill();
  // Jewels
  CX.fillStyle='#FF4444';
  CX.beginPath();CX.arc(cx-s*0.2,cy-s*0.9,s*0.04,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(cx,cy-s*0.95,s*0.04,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(cx+s*0.2,cy-s*0.9,s*0.04,0,Math.PI*2);CX.fill();
  CX.fillStyle='#4169E1';
  CX.beginPath();CX.arc(cx-s*0.1,cy-s*1.0,s*0.03,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(cx+s*0.1,cy-s*1.0,s*0.03,0,Math.PI*2);CX.fill();
  // Eyes
  CX.fillStyle='#FFF';CX.beginPath();CX.arc(cx-s*0.15,cy-s*0.1,s*0.1,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(cx+s*0.15,cy-s*0.1,s*0.1,0,Math.PI*2);CX.fill();
  CX.fillStyle='#4A0080';
  CX.beginPath();CX.arc(cx-s*0.15,cy-s*0.1,s*0.05,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(cx+s*0.15,cy-s*0.1,s*0.05,0,Math.PI*2);CX.fill();
  // Scepter
  CX.strokeStyle='#FFD700';CX.lineWidth=3;
  CX.beginPath();CX.moveTo(cx+s*0.4,cy+s*0.1);CX.lineTo(cx+s*0.6,cy+s*0.3);CX.stroke();
  CX.fillStyle='#FF4444';
  CX.beginPath();CX.arc(cx+s*0.6,cy+s*0.3,s*0.06,0,Math.PI*2);CX.fill();
  drawHP(cx,cy-s*0.8,w,hpR);
}

// ===== HUSKY DRAWING =====
function drawHusky(cx,cy,w,h,isBoss,hpR){
  const s=h;
  // Body
  CX.fillStyle=isBoss?'#555568':'#A0A0B0';
  rRect(cx-s*0.45,cy-s*0.2,w*0.9,s*0.5,s*0.15);
  // Chest
  CX.fillStyle=isBoss?'#C8C8D8':'#E8E8F0';
  rRect(cx-s*0.25,cy-s*0.05,w*0.5,s*0.3,s*0.08);
  // Head
  CX.fillStyle=isBoss?'#666680':'#B0B0C0';
  CX.beginPath();CX.arc(cx,cy-s*0.45,s*0.38,0,Math.PI*2);CX.fill();
  // Face mask
  CX.fillStyle=isBoss?'#D8D8E8':'#F0F0F8';
  CX.beginPath();CX.ellipse(cx,cy-s*0.4,s*0.28,s*0.24,0,0,Math.PI*2);CX.fill();
  // Ears
  CX.fillStyle=isBoss?'#555568':'#9090A0';
  CX.beginPath();CX.moveTo(cx-s*0.3,cy-s*0.6);CX.lineTo(cx-s*0.28,cy-s*1.0);CX.lineTo(cx-s*0.08,cy-s*0.55);CX.fill();
  CX.beginPath();CX.moveTo(cx+s*0.3,cy-s*0.6);CX.lineTo(cx+s*0.28,cy-s*1.0);CX.lineTo(cx+s*0.08,cy-s*0.55);CX.fill();
  // Boss crown
  if(isBoss){
    CX.fillStyle='#FFD700';
    CX.beginPath();CX.moveTo(cx-s*0.35,cy-s*0.6);CX.lineTo(cx-s*0.35,cy-s*0.9);
    CX.lineTo(cx-s*0.2,cy-s*0.7);CX.lineTo(cx-s*0.08,cy-s*0.92);
    CX.lineTo(cx+s*0.08,cy-s*0.7);CX.lineTo(cx+s*0.2,cy-s*0.92);
    CX.lineTo(cx+s*0.35,cy-s*0.9);CX.lineTo(cx+s*0.35,cy-s*0.6);CX.fill();
  }
  // CEO collar
  CX.fillStyle=isBoss?'#111':'#222';

// ===== SPAWNING =====
function spawnCat(){
  const i=G.selectedCat,ct=CAT_TYPES[i];
  if(G.money<ct.cost||CAT_CD[i]>0)return;
  G.money-=ct.cost;CAT_CD[i]=ct.cd;
  G.cats.push({x:70,y:370,vx:ct.spd,hp:ct.hp,hpMax:ct.hp,atk:ct.atk,spd:ct.spd,type:i,w:ct.w,h:ct.h,state:'walk',kills:0,level:1,hitFlash:0,blocked:false});
  addParticles(70,370,8,'#FFD700');
}

function spawnEnemy(typeIdx){
  const et=ENEMY_TYPES[typeIdx],ws=1+G.wave*0.15;
  G.enemies.push({x:395,y:370,vx:-et.spd,hp:Math.floor(et.hp*ws),hpMax:Math.floor(et.hp*ws),atk:Math.floor(et.atk*(1+G.wave*0.08)),spd:et.spd,type:typeIdx,w:et.w,h:et.h,isBoss:typeIdx===5,state:'walk',score:et.score,hitFlash:0,blocked:false});
}

// ===== WAVES =====
function startWave(){
  if(G.wave>=G.totalWaves)return;
  G.waveEnemies=[];
  for(const[t,c]of WAVES[G.wave].enemies)for(let i=0;i<c;i++)G.waveEnemies.push(t);
  for(let i=G.waveEnemies.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[G.waveEnemies[i],G.waveEnemies[j]]=[G.waveEnemies[j],G.waveEnemies[i]];}
  G.waveProgress=0;G.waveState='spawning';G.spawnTimer=0;
}

// ===== QUEUE / LANE SYSTEM =====
// Units walk forward. When cat meets enemy head-on,
// BOTH stop. They fight until one dies.
// The winner walks forward. Units behind the front
// unit stack and wait their turn.

const CAT_CAT_COLLIDE=28;
const CAT_ENEMY_COLLIDE=30;
const ENEMY_CAT_COLLIDE=30;
const ENEMY_ENEMY_COLLIDE=28;

function updateLane(){
  // --- Cat lane: check collision front-to-back ---
  // Sort cats by x (leftmost first)
  G.cats.sort((a,b)=>a.x-b.x);

  for(let i=0;i<G.cats.length;i++){
    const c=G.cats[i];
    if(c.hitFlash>0)c.hitFlash--;
    if(c.state==='dead'){G.cats.splice(i,1);i--;continue;}
    if(c.hp<=0){addParticles(c.x,c.y,10,'#FF6666');G.catsKilled++;G.cats.splice(i,1);i--;continue;}
    if(c.x>390){
      G.enemyBaseHp-=c.atk*0.5;if(G.enemyBaseHp<0)G.enemyBaseHp=0;
      addParticles(390,370,8,'#FF6B35');G.cats.splice(i,1);i--;
      if(G.enemyBaseHp<=0&&!G.gameWon){G.scene='win';G.gameWon=true;}
      continue;
    }

    // Check collision with cats ahead
    let blocked=false;
    for(let j=0;j<i;j++){
      const ahead=G.cats[j];
      if(ahead.state!=='dead'&&ahead.x-c.x<CAT_CAT_COLLIDE&&c.x<ahead.x){
        blocked=true;break;
      }
    }
    // Check collision with enemy front
    let enemyBlock=false;
    for(const e of G.enemies){
      if(e.state!=='dead'&&e.x-c.x<CAT_ENEMY_COLLIDE&&c.x<e.x){
        enemyBlock=true;c.blocked=true;
        // Fight!
        c.atkCD=(c.atkCD||0)-1;
        if(c.atkCD<=0){
          c.atkCD=35;e.hp-=c.atk;e.hitFlash=6;
          G.dmgTexts.push({x:e.x,y:e.y-18,text:'-'+c.atk,life:20,color:'#FF6B6B'});
          addParticles(e.x,e.y-5,5,'#FFD700');
          if(e.hp<=0){
            G.money=Math.min(9999,G.money+ENEMY_TYPES[e.type].score*2);
            G.enemiesKilled++;c.kills++;
            if(c.kills%5===0&&c.level<5){
              c.level++;c.atk=Math.floor(c.atk*1.2);c.hpMax=Math.floor(c.hpMax*1.15);c.hp=c.hpMax;
              addParticles(c.x,c.y-15,15,'#00FF88');
            }
            addParticles(e.x,e.y,12,e.type===5?'#FF4444':'#FFD700');
            e.state='dead';
          }
        }
        break;
      }
    }
    if(!enemyBlock)c.blocked=false;

    // Move if not blocked by anything
    if(!blocked&&!c.blocked){
      c.x+=c.spd;
    }
  }

  // --- Enemy lane: same logic reversed ---
  G.enemies.sort((a,b)=>b.x-a.x); // rightmost first

  for(let i=0;i<G.enemies.length;i++){
    const e=G.enemies[i];
    if(e.hitFlash>0)e.hitFlash--;
    if(e.state==='dead'){G.enemies.splice(i,1);i--;continue;}
    if(e.hp<=0){addParticles(e.x,e.y,12,e.type===5?'#FF4444':'#FFD700');G.enemies.splice(i,1);i--;continue;}
    if(e.x<35){
      G.baseHp-=e.atk;if(G.baseHp<0)G.baseHp=0;
      G.enemies.splice(i,1);i--;addParticles(35,370,8,'#FF4444');
      continue;
    }

    // Check collision with enemies ahead
    let blocked=false;
    for(let j=0;j<i;j++){
      const ahead=G.enemies[j];
      if(ahead.state!=='dead'&&e.x-ahead.x<ENEMY_ENEMY_COLLIDE&&e.x>ahead.x){
        blocked=true;break;
      }
    }
    // Check collision with cat front
    let catBlock=false;
    for(const c of G.cats){
      if(c.state!=='dead'&&c.x-e.x<ENEMY_CAT_COLLIDE&&e.x>c.x){
        catBlock=true;e.blocked=true;
        e.atkCD=(e.atkCD||0)-1;
        if(e.atkCD<=0){
          e.atkCD=45;c.hp-=e.atk;c.hitFlash=6;
          G.dmgTexts.push({x:c.x,y:c.y-18,text:'-'+e.atk,life:20,color:'#FF8888'});
          addParticles(c.x,c.y-5,5,'#FF6666');
          if(c.hp<=0){c.state='dead';G.catsKilled++;addParticles(c.x,c.y,10,'#FF6666');}
        }
        break;
      }
    }
    if(!catBlock)e.blocked=false;

    if(!blocked&&!e.blocked){
      e.x-=e.spd;
    }
  }

  // Clean up dead units
  G.cats=G.cats.filter(c=>c.state!=='dead'&&c.hp>0);
  G.enemies=G.enemies.filter(e=>e.state!=='dead'&&e.hp>0);
}

// ===== UPDATE =====
function update(){
  if(G.pause||G.scene!=='playing')return;
  G.frame++;
  G.energy=Math.min(G.maxEnergy,G.energy+G.energyRegen);
  G.money=Math.min(9999,G.money+G.moneyRegen);
  for(let i=0;i<CAT_TYPES.length;i++)if(CAT_CD[i]>0)CAT_CD[i]--;

  // Waves
  if(G.waveState==='idle'){G.waveTimer++;if(G.waveTimer>120){G.waveTimer=0;startWave();}}
  else if(G.waveState==='spawning'){
    G.spawnTimer++;
    if(G.spawnTimer>=Math.max(25,55-G.wave*2)&&G.waveProgress<G.waveEnemies.length){
      G.spawnTimer=0;spawnEnemy(G.waveEnemies[G.waveProgress]);G.waveProgress++;
    }
    if(G.waveProgress>=G.waveEnemies.length&&G.enemies.length===0){
      G.waveState='idle';G.waveTimer=0;
      G.money=Math.min(9999,G.money+WAVES[G.wave].reward);
      G.enemyBaseHp-=300;if(G.enemyBaseHp<0)G.enemyBaseHp=0;
      addParticles(385,370,25,'#FF4444');G.wave++;
      if(G.wave>=G.totalWaves)G.waveState='final';
    }
  }
  else if(G.waveState==='final'){
    for(let i=G.cats.length-1;i>=0;i--){
      const c=G.cats[i];c.x+=c.spd*0.8;
      if(c.x>385){G.enemyBaseHp-=c.atk*2;addParticles(385,370,8,'#FF6B35');G.cats.splice(i,1);if(G.enemyBaseHp<=0){G.enemyBaseHp=0;G.scene='win';G.gameWon=true;}}
    }
  }

  // Lane system - single file fight to the death!
  updateLane();

  // Particles
  for(let i=G.particles.length-1;i>=0;i--){const p=G.particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;if(p.life<=0)G.particles.splice(i,1);}
  for(let i=G.dmgTexts.length-1;i>=0;i--){const d=G.dmgTexts[i];d.y-=1;d.life--;if(d.life<=0)G.dmgTexts.splice(i,1);}

  if(G.baseHp<=0)G.scene='gameover';
  if(G.enemyBaseHp<=0&&!G.gameWon){G.scene='win';G.gameWon=true;}
}

function render(){
  CX.clearRect(0,0,W,H);
  if(G.scene==='menu'){drawMenu();return;}
  drawBG();drawField();
  const catDraws=[drawCat0,drawCat1,drawCat2,drawCat3,drawCat4,drawCat5,drawCat6];
  G.cats.forEach(c=>{
    if(c.hitFlash>0){CX.save();CX.globalAlpha=.5;CX.fillStyle='#FFF';CX.beginPath();CX.arc(c.x,c.y-8,c.w*0.5,0,Math.PI*2);CX.fill();CX.restore();}
    catDraws[c.type](c.x, 370, c.w, c.h, c.hp/c.hpMax);
  });
  G.enemies.forEach(e=>{
    if(e.hitFlash>0){CX.save();CX.globalAlpha=.5;CX.fillStyle='#FFF';CX.beginPath();CX.arc(e.x,e.y-8,e.w*0.5,0,Math.PI*2);CX.fill();CX.restore();}
    drawHusky(e.x,370,e.w,e.h,e.isBoss,e.hp/e.hpMax);
  });
  G.dmgTexts.forEach(d=>{CX.globalAlpha=d.life/20;CX.fillStyle=d.color;CX.font='bold 12px sans-serif';CX.textAlign='center';CX.fillText(d.text,d.x,d.y);});
  CX.globalAlpha=1;
  G.particles.forEach(p=>{CX.globalAlpha=p.life/p.maxL;CX.fillStyle=p.color;CX.beginPath();CX.arc(p.x,p.y,p.size,0,Math.PI*2);CX.fill()});
  CX.globalAlpha=1;drawUI();drawOverlay();
}

  if(e.key>='1'&&e.key<='7')G.selectedCat=parseInt(e.key)-1;
  if(e.key===' '&&G.scene==='playing'){e.preventDefault();spawnCat();}
  if(e.key===' '||e.key==='Enter'){if(G.scene==='menu'){G.scene='playing';resetGame();}else if(G.scene==='gameover'||G.scene==='win'){G.scene='menu';}}
});
GC.addEventListener('click',e=>{
  const r=GC.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  if(G.scene==='menu'||G.scene==='gameover'||G.scene==='win'){G.scene='playing';resetGame();return;}
  const bw=63;
  for(let i=0;i<7;i++){const bx=12+i*(bw+2);if(y>622&&y<712&&x>bx&&x<bx+bw&&G.money>=CAT_TYPES[i].cost&&CAT_CD[i]<=0){G.selectedCat=i;spawnCat();return;}}
  if(x>60&&x<420&&y>60&&y<622)spawnCat();
});

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(r>w/2)r=w/2;if(r>h/2)r=h/2;
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);return this;
  };
}
gameLoop();
</script>
