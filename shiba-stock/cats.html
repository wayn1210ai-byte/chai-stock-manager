<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🐱 橘犬不寧 TD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI','Noto Sans TC',sans-serif;overflow:hidden}
#wrap{position:relative;width:480px;background:linear-gradient(180deg,#ffe4b5,#fff0db);border-radius:24px;padding:4px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
canvas{display:block;width:480px;height:720px;border-radius:20px;background:#c8e6ff;margin:0 auto;cursor:pointer;touch-action:none}
@media(max-width:500px){
  #wrap{width:100vw;border-radius:0;padding:0}
  canvas{width:100vw;height:calc(100vw*720/480);border-radius:0}
}
</style>
</head>
<body>
<div id="wrap"><canvas id="gc" width="480" height="720"></canvas></div>
<script>
const GC=document.getElementById('gc'),CX=GC.getContext('2d');
const W=480,H=720;

/* ============================================================
   GAME STATE
   ============================================================ */
const G={
  scene:'menu', money:600, energy:60, maxEnergy:100,
  energyRegen:0.08, moneyRegen:0.5,
  baseHp:3000, maxBaseHp:3000,
  enemyBaseHp:3000, maxEnemyBaseHp:3000,
  frame:0, cats:[], enemies:[], particles:[],
  wave:0, waveEnemies:[], waveProgress:0, waveState:'idle',
  waveTimer:0, spawnTimer:0, selectedCat:0, pause:false,
  totalWaves:10, catsKilled:0, enemiesKilled:0,
  bossSpawned:false, gameWon:false,
  stats:{}
};

/* ============================================================
   CAT TYPES (7 units - balanced for playability)
   ============================================================ */
const CAT_TYPES=[
  {name:'小橘貓', cost:80,  hp:400, atk:40,  range:32, spd:2.0, cd:90,  size:18, desc:'基本步兵'},
  {name:'金冠貓', cost:150, hp:1800,atk:15,  range:26, spd:1.3, cd:150, size:22, desc:'肉盾坦克'},
  {name:'圍兜貓', cost:250, hp:350, atk:130, range:28, spd:1.6, cd:120, size:20, desc:'近戰輸出'},
  {name:'招財貓', cost:400, hp:500, atk:180, range:60, spd:1.0, cd:180, size:18, desc:'遠程射手'},
  {name:'虎斑貓', cost:350, hp:300, atk:80,  range:24, spd:4.0, cd:80,  size:19, desc:'高速突擊'},
  {name:'飛天貓', cost:600, hp:250, atk:220, range:65, spd:2.5, cd:200, size:17, desc:'精準打擊'},
  {name:'貓皇帝', cost:1200,hp:2500,atk:600, range:42, spd:1.8, cd:400, size:28, desc:'終極戰力'}
];
const CAT_CD=new Array(CAT_TYPES.length).fill(0);

/* ============================================================
   ENEMY TYPES (CEO HUSKY ARMY)
   ============================================================ */
const ENEMY_TYPES=[
  {name:'實習二哈', hp:200, atk:20, spd:1.6, score:10},
  {name:'經理二哈', hp:500, atk:40, spd:2.0, score:25},
  {name:'副總二哈', hp:1000,atk:60, spd:1.3, score:50},
  {name:'執行二哈', hp:1500,atk:120,spd:1.0, score:80},
  {name:'變種二哈', hp:3000,atk:200,spd:0.8, score:150},
  {name:'CEO大魔王', hp:8000,atk:400,spd:0.6, score:500}
];

/* ============================================================
   WAVE DEFINITIONS
   ============================================================ */
const WAVES=[
  {enemies:[[0,5]],                   reward:100, desc:'實習生來襲'},
  {enemies:[[0,4],[1,2]],             reward:150, desc:'經理加入戰局'},
  {enemies:[[0,3],[1,3],[2,1]],       reward:200, desc:'副總登場'},
  {enemies:[[1,4],[2,2],[3,1]],       reward:300, desc:'執行官壓陣'},
  {enemies:[[0,5],[2,3],[3,2]],       reward:350, desc:'混合軍團'},
  {enemies:[[1,3],[3,3],[4,1]],       reward:450, desc:'變種二哈出擊'},
  {enemies:[[0,6],[2,4],[3,2],[4,2]], reward:500, desc:'全面進攻'},
  {enemies:[[2,4],[3,3],[4,3]],       reward:600, desc:'精銳部隊'},
  {enemies:[[3,4],[4,4],[5,1]],       reward:800, desc:'CEO護衛隊'},
  {enemies:[[5,1]],                   reward:1000,desc:'👑 CEO大魔王'}
];

/* ============================================================
   KENNEY-STYLE DRAWING FUNCTIONS
   ============================================================ */

// === KENNEY ORANGE CAT ===
function drawKenneyCat(cx, cy, s, hpR, isPlayer) {
  CX.save(); CX.translate(cx, cy);
  const body = isPlayer ? '#FFA451' : '#E07030';
  const dark = isPlayer ? '#D48030' : '#C06020';

  // Shadow
  CX.fillStyle='rgba(0,0,0,0.12)';
  CX.beginPath(); CX.ellipse(2, s*0.55, s*0.6, s*0.12, 0, 0, Math.PI*2); CX.fill();

  // Body
  CX.fillStyle = body;
  fillRnd(-s*0.42, -s*0.1, s*0.84, s*0.48, s*0.15);

  // Belly
  if(isPlayer) {
    CX.fillStyle = '#FFE0B0';
    fillRnd(-s*0.25, 0, s*0.5, s*0.28, s*0.08);
  }

  // Legs
  const la = Math.sin(G.frame*0.15)*0.03*s;
  CX.fillStyle = dark;
  fillRnd(-s*0.32, s*0.32, s*0.14, s*0.2+la, 3);
  fillRnd(-s*0.1,  s*0.32, s*0.14, s*0.2-la, 3);
  fillRnd( s*0.1,  s*0.32, s*0.14, s*0.2+la, 3);
  fillRnd( s*0.28, s*0.32, s*0.14, s*0.2-la, 3);

  // Head
  CX.fillStyle = body;
  CX.beginPath(); CX.arc(0, -s*0.40, s*0.38, 0, Math.PI*2); CX.fill();

  // Ears
  CX.fillStyle = isPlayer ? '#FF8C42' : '#D06020';
  CX.beginPath(); CX.moveTo(-s*0.25,-s*0.55); CX.lineTo(-s*0.32,-s*0.90); CX.lineTo(-s*0.08,-s*0.55); CX.fill();
  CX.beginPath(); CX.moveTo( s*0.25,-s*0.55); CX.lineTo( s*0.32,-s*0.90); CX.lineTo( s*0.08,-s*0.55); CX.fill();
  CX.fillStyle = '#FFB0B0';
  CX.beginPath(); CX.moveTo(-s*0.22,-s*0.58); CX.lineTo(-s*0.27,-s*0.80); CX.lineTo(-s*0.12,-s*0.58); CX.fill();
  CX.beginPath(); CX.moveTo( s*0.22,-s*0.58); CX.lineTo( s*0.27,-s*0.80); CX.lineTo( s*0.12,-s*0.58); CX.fill();

  // Crown
  if(isPlayer) {
    CX.fillStyle='#FFD700';
    CX.beginPath();
    CX.moveTo(-s*0.35,-s*0.62); CX.lineTo(-s*0.35,-s*0.85);
    CX.lineTo(-s*0.23,-s*0.70); CX.lineTo(-s*0.12,-s*0.88);
    CX.lineTo( 0,    -s*0.68); CX.lineTo( s*0.12,-s*0.88);
    CX.lineTo( s*0.23,-s*0.70); CX.lineTo( s*0.35,-s*0.85);
    CX.lineTo( s*0.35,-s*0.62); CX.closePath(); CX.fill();
    CX.fillStyle='#FF4444';
    CX.beginPath(); CX.arc(-s*0.14,-s*0.76, s*0.035,0,Math.PI*2); CX.fill();
    CX.beginPath(); CX.arc( 0,    -s*0.78, s*0.035,0,Math.PI*2); CX.fill();
    CX.beginPath(); CX.arc( s*0.14,-s*0.76, s*0.035,0,Math.PI*2); CX.fill();
  }

  // Eyes
  const ey = -s*0.38;
  CX.fillStyle='#FFF'; CX.beginPath(); CX.ellipse(-s*0.14,ey, s*0.10,s*0.09,0,0,Math.PI*2); CX.fill();
  CX.beginPath(); CX.ellipse( s*0.14,ey, s*0.10,s*0.09,0,0,Math.PI*2); CX.fill();
  CX.fillStyle='#333';
  const dir = isPlayer?1:-1;
  CX.beginPath(); CX.arc(-s*0.14+dir*0.02, ey, s*0.05,0,Math.PI*2); CX.fill();
  CX.beginPath(); CX.arc( s*0.14+dir*0.02, ey, s*0.05,0,Math.PI*2); CX.fill();
  CX.fillStyle='#FFF';
  CX.beginPath(); CX.arc(-s*0.12+dir*0.02, ey-s*0.02, s*0.025,0,Math.PI*2); CX.fill();
  CX.beginPath(); CX.arc( s*0.16+dir*0.02, ey-s*0.02, s*0.025,0,Math.PI*2); CX.fill();

  // Nose
  CX.fillStyle='#FF7FAA';
  CX.beginPath(); CX.moveTo(-s*0.04,ey+s*0.08); CX.lineTo(s*0.04,ey+s*0.08); CX.lineTo(0,ey+s*0.12); CX.closePath(); CX.fill();

  // Mouth
  if(isPlayer) {
    CX.strokeStyle='#555'; CX.lineWidth=1;
    CX.beginPath(); CX.arc(0,ey+s*0.11,s*0.05,0.2,Math.PI-0.2); CX.stroke();
  }

  // Whiskers
  CX.strokeStyle='rgba(0,0,0,0.2)'; CX.lineWidth=0.8;
  for(let side=-1;side<=1;side+=2) {
    for(let w=0;w<3;w++) {
      CX.beginPath(); CX.moveTo(side*s*0.20, ey+w*0.04*s);
      CX.lineTo(side*s*0.42, ey+(w-1)*0.06*s); CX.stroke();
    }
  }

  // Tail
  CX.strokeStyle=dark; CX.lineWidth=s*0.12;
  CX.lineCap='round';
  CX.beginPath(); CX.moveTo(-dir*s*0.30, s*0.15);
  CX.quadraticCurveTo(-dir*s*0.55, -s*0.15, -dir*s*0.50, -s*0.30);
  CX.stroke();
  CX.fillStyle=isPlayer?'#FFF':'#DDD';
  CX.beginPath(); CX.arc(-dir*s*0.50, -s*0.30, s*0.07, 0, Math.PI*2); CX.fill();

  // HP bar
  if(hpR<1) {
    const bw=s*1.4, bh=3;
    CX.fillStyle='rgba(0,0,0,0.3)'; CX.fillRect(-bw/2,-s*0.95,bw,bh);
    CX.fillStyle=hpR>0.5?'#44CC44':hpR>0.25?'#FFAA00':'#FF4444';
    CX.fillRect(-bw/2,-s*0.95,bw*hpR,bh);
  }
  CX.restore();
}

// === KENNEY CEO HUSKY ===
function drawKenneyHusky(cx, cy, s, hpR) {
  CX.save(); CX.translate(cx, cy);
  CX.fillStyle='rgba(0,0,0,0.12)';
  CX.beginPath(); CX.ellipse(2, s*0.55, s*0.6, s*0.12, 0, 0, Math.PI*2); CX.fill();

  CX.fillStyle='#A0A0B0';
  fillRnd(-s*0.44, -s*0.1, s*0.88, s*0.50, s*0.15);
  CX.fillStyle='#E8E8F0';
  fillRnd(-s*0.25, s*0.02, s*0.50, s*0.30, s*0.10);

  const la=Math.sin(G.frame*0.15)*0.03*s;
  CX.fillStyle='#888898';
  fillRnd(-s*0.34, s*0.34, s*0.14, s*0.2+la, 3);
  fillRnd(-s*0.12, s*0.34, s*0.14, s*0.2-la, 3);
  fillRnd( s*0.12, s*0.34, s*0.14, s*0.2+la, 3);
  fillRnd( s*0.30, s*0.34, s*0.14, s*0.2-la, 3);
  CX.fillStyle='#E8E8F0';
  fillRnd(-s*0.34, s*0.46, s*0.14, s*0.08, 3);
  fillRnd(-s*0.12, s*0.46, s*0.14, s*0.08, 3);
  fillRnd( s*0.12, s*0.46, s*0.14, s*0.08, 3);
  fillRnd( s*0.30, s*0.46, s*0.14, s*0.08, 3);

  CX.fillStyle='#B0B0C0';
  CX.beginPath(); CX.arc(0, -s*0.42, s*0.40, 0, Math.PI*2); CX.fill();
  CX.fillStyle='#F0F0F8';
  CX.beginPath(); CX.ellipse(0, -s*0.36, s*0.30, s*0.26, 0, 0, Math.PI*2); CX.fill();

  CX.fillStyle='#9090A0';
  CX.beginPath(); CX.moveTo(-s*0.26,-s*0.55); CX.lineTo(-s*0.24,-s*0.95); CX.lineTo(-s*0.06,-s*0.55); CX.fill();
  CX.beginPath(); CX.moveTo( s*0.26,-s*0.55); CX.lineTo( s*0.24,-s*0.95); CX.lineTo( s*0.06,-s*0.55); CX.fill();
  CX.fillStyle='#FFB0B0';
  CX.beginPath(); CX.moveTo(-s*0.21,-s*0.60); CX.lineTo(-s*0.20,-s*0.85); CX.lineTo(-s*0.09,-s*0.60); CX.fill();
  CX.beginPath(); CX.moveTo( s*0.21,-s*0.60); CX.lineTo( s*0.20,-s*0.85); CX.lineTo( s*0.09,-s*0.60); CX.fill();

  CX.fillStyle='#222';
  fillRnd(-s*0.32, -s*0.57, s*0.64, s*0.10, 3);
  CX.fillStyle='#FFD700';
  CX.font='bold '+(s*0.16)+'px sans-serif'; CX.textAlign='center'; CX.textBaseline='middle';
  CX.fillText('CEO',0,-s*0.52);
  CX.textBaseline='alphabetic';

  const ey=-s*0.38;
  CX.fillStyle='#87CEEB';
  CX.beginPath(); CX.ellipse(-s*0.15,ey, s*0.10,s*0.08,0,0,Math.PI*2); CX.fill();
  CX.beginPath(); CX.ellipse( s*0.15,ey, s*0.10,s*0.08,0,0,Math.PI*2); CX.fill();
  CX.fillStyle='#333';
  CX.beginPath(); CX.arc(-s*0.15,ey, s*0.05,0,Math.PI*2); CX.fill();
  CX.beginPath(); CX.arc( s*0.15,ey, s*0.05,0,Math.PI*2); CX.fill();

  CX.fillStyle='#FF6B8A';
  CX.beginPath(); CX.ellipse(0, ey+s*0.16, s*0.06, s*0.10, 0, 0, Math.PI*2); CX.fill();
  CX.fillStyle='#FF99A8';
  CX.beginPath(); CX.ellipse(0, ey+s*0.18, s*0.04, s*0.06, 0, 0, Math.PI*2); CX.fill();

  CX.fillStyle='#333';
  CX.beginPath(); CX.ellipse(0, ey+s*0.09, s*0.05, s*0.04, 0, 0, Math.PI*2); CX.fill();

  CX.strokeStyle='#9090A0'; CX.lineWidth=s*0.12;
  CX.lineCap='round';
  CX.beginPath(); CX.moveTo(s*0.30, s*0.15);
  CX.quadraticCurveTo(s*0.55, -s*0.05, s*0.58, 0);
  CX.stroke();
  CX.fillStyle='#E8E8F0';
  CX.beginPath(); CX.arc(s*0.58, 0, s*0.08, 0, Math.PI*2); CX.fill();

  if(hpR<1) {
    const bw=s*1.4, bh=3;
    CX.fillStyle='rgba(0,0,0,0.3)'; CX.fillRect(-bw/2,-s*0.95,bw,bh);
    CX.fillStyle=hpR>0.5?'#44CC44':hpR>0.25?'#FFAA00':'#FF4444';
    CX.fillRect(-bw/2,-s*0.95,bw*hpR,bh);
  }
  CX.restore();
}

/* ============================================================
   HELPERS
   ============================================================ */
function fillRnd(x,y,w,h,r) {
  if(r>w/2)r=w/2; if(r>h/2)r=h/2;
  CX.beginPath();
  CX.moveTo(x+r,y); CX.lineTo(x+w-r,y);
  CX.quadraticCurveTo(x+w,y,x+w,y+r);
  CX.lineTo(x+w,y+h-r);
  CX.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  CX.lineTo(x+r,y+h);
  CX.quadraticCurveTo(x,y+h,x,y+h-r);
  CX.lineTo(x,y+r);
  CX.quadraticCurveTo(x,y,x+r,y);
  CX.closePath(); CX.fill();
}

function addParticles(x,y,n,c) {
  for(let i=0;i<n;i++) G.particles.push({
    x,y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4-2,
    life:20+Math.random()*20, maxL:40, color:c, size:2+Math.random()*3
  });
}

/* ============================================================
   SPAWNING
   ============================================================ */
function spawnCat() {
  const i=G.selectedCat, ct=CAT_TYPES[i];
  if(G.money<ct.cost || CAT_CD[i]>0) return;
  G.money -= ct.cost;
  CAT_CD[i] = ct.cd;
  G.cats.push({
    x:65, y:380-Math.random()*40, vx:ct.spd,
    hp:ct.hp, hpMax:ct.hp, atk:ct.atk, range:ct.range,
    atkCD:0, atkInt:35, type:i, size:ct.size, state:'walk',
    kills:0, level:1
  });
  addParticles(65,380,8,'#FFD700');
}

function spawnEnemy(typeIdx) {
  const et=ENEMY_TYPES[typeIdx];
  const waveScale = 1 + G.wave * 0.15;
  const hp = Math.floor(et.hp * waveScale);
  const atk = Math.floor(et.atk * (1 + G.wave * 0.08));
  G.enemies.push({
    x:395, y:370-Math.random()*40, vx:-et.spd,
    hp, hpMax:hp, atk, atkCD:0, atkInt:45,
    type:typeIdx, state:'walk', size:typeIdx===5?32:16, score:et.score
  });
}

/* ============================================================
   WAVE MANAGEMENT
   ============================================================ */
function startWave() {
  if(G.wave >= G.totalWaves) return;
  const waveData = WAVES[G.wave];
  G.waveEnemies = [];
  for(const [type, count] of waveData.enemies) {
    for(let i=0; i<count; i++) G.waveEnemies.push(type);
  }
  for(let i=G.waveEnemies.length-1; i>0; i--) {
    const j=Math.floor(Math.random()*(i+1));
    [G.waveEnemies[i], G.waveEnemies[j]] = [G.waveEnemies[j], G.waveEnemies[i]];
  }
  G.waveProgress = 0;
  G.waveState = 'spawning';
  G.spawnTimer = 0;
}

/* ============================================================
   UPDATE
   ============================================================ */
function update() {
  if(G.pause || G.scene!=='playing') return;
  G.frame++;
  G.energy = Math.min(G.maxEnergy, G.energy+G.energyRegen);
  G.money = Math.min(9999, G.money+G.moneyRegen);
  for(let i=0;i<CAT_TYPES.length;i++) if(CAT_CD[i]>0) CAT_CD[i]--;

  // === WAVE LOGIC ===
  if(G.waveState === 'idle') {
    G.waveTimer++;
    if(G.waveTimer > 120) { G.waveTimer=0; startWave(); }
  }
  else if(G.waveState === 'spawning') {
    G.spawnTimer++;
    const spawnGap = Math.max(25, 55 - G.wave*2);
    if(G.spawnTimer >= spawnGap && G.waveProgress < G.waveEnemies.length) {
      G.spawnTimer = 0;
      spawnEnemy(G.waveEnemies[G.waveProgress]);
      G.waveProgress++;
    }
    if(G.waveProgress >= G.waveEnemies.length && G.enemies.length === 0) {
      G.waveState = 'idle';
      G.waveTimer = 0;
      const reward = WAVES[G.wave].reward;
      G.money = Math.min(9999, G.money + reward);
      G.enemyBaseHp -= 300;
      if(G.enemyBaseHp < 0) G.enemyBaseHp = 0;
      addParticles(385, 360, 25, '#FF4444');
      G.wave++;
      if(G.wave >= G.totalWaves) {
        G.waveState = 'final';
      }
    }
  }
  else if(G.waveState === 'final') {
    for(let i=G.cats.length-1;i>=0;i--) {
      const c=G.cats[i];
      c.vx = CAT_TYPES[c.type].spd * 0.8;
      c.x += c.vx;
      if(c.x > 385) {
        G.enemyBaseHp -= c.atk * 2;
        addParticles(385, 360, 8, '#FF6B35');
        G.cats.splice(i,1);
        if(G.enemyBaseHp <= 0) { G.enemyBaseHp = 0; G.scene='win'; G.gameWon=true; }
      }
    }
  }

  // === UPDATE CATS ===
  for(let i=G.cats.length-1;i>=0;i--) {
    const c=G.cats[i];
    if(c.state==='dead') { G.cats.splice(i,1); continue; }

    let target=null, md=999;
    G.enemies.forEach(e=>{ const d=e.x-c.x; if(d>0 && d<md) { md=d; target=e; } });

    if(target && md < c.range+10) {
      c.vx=0; c.atkCD--;
      if(c.atkCD<=0) {
        c.atkCD=c.atkInt;
        target.hp -= c.atk;
        addParticles(target.x,target.y-5,4,'#FFD700');
        if(target.hp<=0) {
          const idx=G.enemies.indexOf(target);
          if(idx>-1) {
            G.money = Math.min(9999, G.money + ENEMY_TYPES[target.type].score*2);
            G.enemiesKilled++;
            c.kills++;
            if(c.kills % 5 === 0 && c.level < 5) {
              c.level++;
              c.atk = Math.floor(c.atk * 1.2);
              c.hpMax = Math.floor(c.hpMax * 1.15);
              c.hp = c.hpMax;
              addParticles(c.x, c.y-15, 15, '#00FF88');
            }
            G.enemies.splice(idx,1);
            addParticles(target.x,target.y,12,target.type===5?'#FF4444':'#FFD700');
          }
        }
      }
    } else {
      c.vx = CAT_TYPES[c.type].spd;
      c.x += c.vx;
    }
    if(c.x>390) {
      G.enemyBaseHp -= c.atk * 0.4;
      if(G.enemyBaseHp<0) G.enemyBaseHp=0;
      addParticles(390,360,8,'#FF6B35');
      G.cats.splice(i,1);
      if(G.enemyBaseHp<=0 && !G.gameWon) { G.scene='win'; G.gameWon=true; }
    }
    if(c.hp<=0) {
      addParticles(c.x,c.y,10,'#FF6666');
      G.catsKilled++; G.cats.splice(i,1);
    }
  }

  // === UPDATE ENEMIES ===
  for(let i=G.enemies.length-1;i>=0;i--) {
    const e=G.enemies[i];
    let target=null, md=999;
    G.cats.forEach(c=>{ const d=c.x-e.x; if(d>0 && d<md) { md=d; target=c; } });

    if(target && md<22) {
      e.vx=0; e.atkCD--;
      if(e.atkCD<=0) {
        e.atkCD=e.atkInt;
        target.hp -= e.atk;
        if(target.hp<=0) { target.state='dead'; G.catsKilled++; addParticles(target.x,target.y,10,'#FF6666'); }
      }
    } else {
      e.vx = -(ENEMY_TYPES[e.type] ? ENEMY_TYPES[e.type].spd : 1.5);
      e.x += e.vx;
    }
    if(e.x<35) {
      G.baseHp -= e.atk;
      if(G.baseHp<0) G.baseHp=0;
      G.enemies.splice(i,1);
      addParticles(35,360,8,'#FF4444');
    }
  }

  // === PARTICLES ===
  for(let i=G.particles.length-1;i>=0;i--) {
    const p=G.particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life--;
    if(p.life<=0) G.particles.splice(i,1);
  }

  if(G.baseHp<=0) G.scene='gameover';
  if(G.enemyBaseHp<=0 && !G.gameWon) { G.scene='win'; G.gameWon=true; }
}

function render() {

  drawBG(); drawBattlefield();
  G.cats.forEach(c=>drawKenneyCat(c.x,c.y,c.size,c.hp/c.hpMax,true));
  G.enemies.forEach(e=>drawKenneyHusky(e.x,e.y,e.size,e.hp/e.hpMax));

}
