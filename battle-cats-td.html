<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🐱 橘犬不寧 TD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI','Noto Sans TC',sans-serif;overflow:hidden}
#wrap{position:relative;width:420px;background:linear-gradient(180deg,#ffe4b5,#fff0db);border-radius:24px;padding:4px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
canvas{display:block;width:412px;height:700px;border-radius:20px;background:#c8e6ff;margin:0 auto;cursor:pointer;touch-action:none}
@media(max-width:440px){
  #wrap{width:100vw;border-radius:0;padding:0}
  canvas{width:100vw;height:calc(100vw*700/412);border-radius:0}
}
</style>
</head>
<body>
<div id="wrap"><canvas id="gc" width="412" height="700"></canvas></div>
<script>
const GC=document.getElementById('gc'),CX=GC.getContext('2d');
const W=412,H=700;

// ===== GAME STATE =====
const G={scene:'menu',money:800,energy:100,maxEnergy:100,energyRegen:.08,moneyRegen:.3,
  baseHp:5000,maxBaseHp:5000,enemyBaseHp:5000,maxEnemyBaseHp:5000,
  frame:0,cats:[],enemies:[],particles:[],spawnTimer:0,selectedCat:0,pause:false};

// ===== CAT UNITS (橘貓軍團) =====
const CAT_TYPES=[
  {name:'小橘貓',cost:100,hp:500,atk:50,range:30,spd:1.8,cd:120,size:10},
  {name:'金冠貓',cost:200,hp:2000,atk:20,range:20,spd:1.2,cd:180,size:14},
  {name:'圍兜貓',cost:300,hp:400,atk:150,range:20,spd:1.5,cd:150,size:12},
  {name:'招財貓',cost:450,hp:600,atk:200,range:55,spd:.9,cd:200,size:11},
  {name:'虎斑貓',cost:500,hp:350,atk:100,range:18,spd:3.5,cd:120,size:13},
  {name:'飛天貓',cost:700,hp:300,atk:250,range:60,spd:2.2,cd:200,size:10},
  {name:'貓皇帝',cost:1500,hp:3000,atk:800,range:45,spd:1.5,cd:600,size:18}
];
const CAT_CD=new Array(CAT_TYPES.length).fill(0);

// ===== ENEMY TYPES (CEO二哈軍團) =====
const ENEMY_TYPES=[
  {name:'實習二哈',hp:300,atk:30,spd:1.5,score:10},
  {name:'經理二哈',hp:800,atk:60,spd:1.8,score:30},
  {name:'副總二哈',hp:1500,atk:80,spd:1.2,score:50},
  {name:'執行二哈',hp:2000,atk:150,spd:.9,score:80},
  {name:'變種二哈',hp:4000,atk:250,spd:.7,score:200},
  {name:'CEO大魔王',hp:10000,atk:500,spd:.5,score:500}
];

// ===== KEYS =====
document.addEventListener('keydown',e=>{
  if(e.key==='p'||e.key==='P')G.pause=!G.pause;
  if(e.key>='1'&&e.key<='7')G.selectedCat=parseInt(e.key)-1;
  if(e.key===' '&&G.scene==='playing'){e.preventDefault();spawnCat();}
  if(e.key===' '||e.key==='Enter'){
    if(G.scene==='menu'){G.scene='playing';resetGame();}
    else if(G.scene==='gameover'||G.scene==='win'){G.scene='menu';}
  }
});

// ===== CLICK / TAP =====
GC.addEventListener('click',e=>{
  const r=GC.getBoundingClientRect();
  const x=(e.clientX-r.left)*412/r.width;
  const y=(e.clientY-r.top)*700/r.height;
  if(G.scene==='menu'||G.scene==='gameover'||G.scene==='win'){G.scene='playing';resetGame();return}
  // Cat buttons
  if(y>600&&y<690&&x>10&&x<402){
    const bw=56;
    for(let i=0;i<7;i++){
      const bx=14+i*(bw+2);
      if(x>bx&&x<bx+bw&&G.money>=CAT_TYPES[i].cost&&CAT_CD[i]<=0){
        G.selectedCat=i;spawnCat();return;
      }
    }
  }
  // Quick deploy
  if(x>200&&y<600)spawnCat();
});

// ===== SPAWN CAT =====
function spawnCat(){
  const i=G.selectedCat,ct=CAT_TYPES[i];
  if(G.money<ct.cost||CAT_CD[i]>0)return;
  G.money-=ct.cost;
  CAT_CD[i]=ct.cd;
  G.cats.push({x:55,y:370-Math.random()*40,vx:ct.spd,hp:ct.hp,hpMax:ct.hp,
    atk:ct.atk,range:ct.range,atkCD:0,atkInt:40,type:i,size:ct.size,state:'walk'});
  addParticles(55,370,10,'#ffd700');
}

// ===== SPAWN ENEMY (CEO二哈) =====
function spawnEnemy(){
  const wave=Math.floor(G.frame/600)+1;
  let ti=Math.min(Math.floor(Math.random()*(1+wave*.3)),5);
  if(wave>3&&Math.random()<.1)ti=5;
  const et=ENEMY_TYPES[ti];
  const hp=Math.floor(et.hp*(1+wave*.12));
  G.enemies.push({x:385,y:360-Math.random()*40,vx:-et.spd,
    hp,hpMax:hp,atk:Math.floor(et.atk*(1+wave*.08)),
    atkCD:0,atkInt:50,type:ti,state:'walk',size:12});
}

// ===== PARTICLES =====
function addParticles(x,y,n,c){
  for(let i=0;i<n;i++)G.particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4-2,life:30+Math.random()*20,maxL:50,color:c,size:2+Math.random()*3});
}

// ===== DRAW ORANGE CAT (with crown + blue bib) =====
function drawOrangeCat(cx,cy,s,hpR,isPlayer){
  const dir=isPlayer?1:-1;
  CX.save();CX.translate(cx,cy);
  const bodyC=isPlayer?'#ff8c42':'#ff6a00';
  
  // Body
  CX.fillStyle=bodyC;
  CX.beginPath();CX.ellipse(0,s*.1,s*.5,s*.45,0,0,Math.PI*2);CX.fill();
  
  // Blue bib (only player cats have it)
  if(isPlayer){
    CX.fillStyle='#1e90ff';
    CX.beginPath();CX.ellipse(0,s*.05,s*.35,s*.3,0,0,Math.PI*2);CX.fill();
    CX.fillStyle='#fff';
    CX.font='bold '+(s*.35)+'px sans-serif';CX.textAlign='center';
    CX.fillText('福',0,s*.1);
  }
  
  // Head
  CX.fillStyle=bodyC;
  CX.beginPath();CX.arc(0,-s*.45,s*.4,0,Math.PI*2);CX.fill();
  
  // Ears
  CX.fillStyle='#d2691e';
  CX.beginPath();CX.moveTo(-s*.28,-s*.65);CX.lineTo(-s*.22,-s*.95);CX.lineTo(-s*.08,-s*.6);CX.fill();
  CX.beginPath();CX.moveTo(s*.28,-s*.65);CX.lineTo(s*.22,-s*.95);CX.lineTo(s*.08,-s*.6);CX.fill();
  CX.fillStyle='#ffb5c5';
  CX.beginPath();CX.moveTo(-s*.23,-s*.68);CX.lineTo(-s*.19,-s*.87);CX.lineTo(-s*.11,-s*.63);CX.fill();
  CX.beginPath();CX.moveTo(s*.23,-s*.68);CX.lineTo(s*.19,-s*.87);CX.lineTo(s*.11,-s*.63);CX.fill();
  
  // Golden crown (player only)
  if(isPlayer){
    CX.fillStyle='#ffd700';
    CX.beginPath();
    CX.moveTo(-s*.35,-s*.7);CX.lineTo(-s*.35,-s*.9);
    CX.lineTo(-s*.23,-s*.75);CX.lineTo(-s*.12,-s*.92);
    CX.lineTo(0,-s*.73);CX.lineTo(s*.12,-s*.92);
    CX.lineTo(s*.23,-s*.75);CX.lineTo(s*.35,-s*.9);
    CX.lineTo(s*.35,-s*.7);CX.closePath();CX.fill();
    CX.fillStyle='#ff4444';
    CX.beginPath();CX.arc(-s*.15,-s*.81,s*.04,0,Math.PI*2);CX.fill();
    CX.beginPath();CX.arc(0,-s*.83,s*.04,0,Math.PI*2);CX.fill();
    CX.beginPath();CX.arc(s*.15,-s*.81,s*.04,0,Math.PI*2);CX.fill();
  }
  
  // Eyes
  const ey=-s*.42;
  CX.fillStyle='#fff';
  CX.beginPath();CX.ellipse(-s*.15,ey,s*.1,s*.09,0,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.ellipse(s*.15,ey,s*.1,s*.09,0,0,Math.PI*2);CX.fill();
  CX.fillStyle='#222';
  CX.beginPath();CX.arc(-s*.15+dir*.03,ey,s*.05,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(s*.15+dir*.03,ey,s*.05,0,Math.PI*2);CX.fill();
  CX.fillStyle='#fff';
  CX.beginPath();CX.arc(-s*.12+dir*.03,ey-s*.02,s*.025,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(s*.18+dir*.03,ey-s*.02,s*.025,0,Math.PI*2);CX.fill();
  
  // Nose
  CX.fillStyle='#ff69b4';
  CX.beginPath();CX.moveTo(-s*.04,ey+s*.09);CX.lineTo(s*.04,ey+s*.09);CX.lineTo(0,ey+s*.13);CX.closePath();CX.fill();
  
  // Mouth
  CX.strokeStyle='#555';CX.lineWidth=1;
  if(isPlayer){
    CX.beginPath();CX.arc(0,ey+s*.12,s*.06,.2,Math.PI-.2);CX.stroke();
  } else {
    CX.beginPath();CX.arc(0,ey+s*.14,s*.08,0,Math.PI);CX.stroke();
  }
  
  // Whiskers
  CX.strokeStyle='#aaa';CX.lineWidth=.8;
  for(let s2=-1;s2<=1;s2+=2){
    for(let wi=0;wi<3;wi++){
      CX.beginPath();CX.moveTo(s2*s*.22,ey+wi*.04*s);
      CX.lineTo(s2*s*.45,ey+(wi-1)*.07*s);CX.stroke();
    }
  }
  
  // Tail (player)
  if(isPlayer){
    CX.strokeStyle='#d2691e';CX.lineWidth=2.5;
    CX.beginPath();CX.moveTo(-dir*s*.25,s*.1);
    CX.quadraticCurveTo(-dir*s*.55,-s*.3,-dir*s*.45,-s*.5);
    CX.stroke();
  }
  
  // Legs
  CX.fillStyle='#d2691e';
  const la=Math.sin(G.frame*.12)*.03*s;
  CX.fillRect(-s*.22,s*.35,s*.14,s*.22+la);
  CX.fillRect(s*.08,s*.35,s*.14,s*.22-la);
  
  // HP bar
  if(hpR<1){
    const bw=s*1.3,bh=3;
    CX.fillStyle='rgba(0,0,0,.4)';CX.fillRect(-bw/2,-s*.85,bw,bh);
    CX.fillStyle=hpR>.5?'#44ff44':hpR>.25?'#ffaa00':'#ff4444';
    CX.fillRect(-bw/2,-s*.85,bw*hpR,bh);
  }
  CX.restore();
}

// ===== DRAW CEO HUSKY =====
function drawHusky(cx,cy,s,hpR){
  CX.save();CX.translate(cx,cy);
  
  // Body
  CX.fillStyle='#aaa';
  CX.beginPath();CX.ellipse(0,s*.1,s*.5,s*.45,0,0,Math.PI*2);CX.fill();
  // White belly
  CX.fillStyle='#eee';
  CX.beginPath();CX.ellipse(0,s*.15,s*.3,s*.28,0,0,Math.PI*2);CX.fill();
  
  // Head
  CX.fillStyle='#bbb';
  CX.beginPath();CX.arc(0,-s*.45,s*.4,0,Math.PI*2);CX.fill();
  // Face mask (white)
  CX.fillStyle='#fff';
  CX.beginPath();CX.ellipse(0,-s*.4,s*.3,s*.25,0,0,Math.PI*2);CX.fill();
  
  // Ears (pointed husky ears)
  CX.fillStyle='#888';
  CX.beginPath();CX.moveTo(-s*.25,-s*.6);CX.lineTo(-s*.2,-s*.95);CX.lineTo(-s*.05,-s*.58);CX.fill();
  CX.beginPath();CX.moveTo(s*.25,-s*.6);CX.lineTo(s*.2,-s*.95);CX.lineTo(s*.05,-s*.58);CX.fill();
  CX.fillStyle='#ffb5c5';
  CX.beginPath();CX.moveTo(-s*.2,-s*.63);CX.lineTo(-s*.17,-s*.87);CX.lineTo(-s*.08,-s*.6);CX.fill();
  CX.beginPath();CX.moveTo(s*.2,-s*.63);CX.lineTo(s*.17,-s*.87);CX.lineTo(s*.08,-s*.6);CX.fill();
  
  // CEO Collar
  CX.fillStyle='#111';
  CX.fillRect(-s*.35,-s*.62,s*.7,s*.12);
  CX.fillStyle='#ffd700';
  CX.font='bold '+(s*.22)+'px sans-serif';CX.textAlign='center';CX.textBaseline='middle';
  CX.fillText('CEO',0,-s*.56);
  CX.textBaseline='alphabetic';
  
  // Eyes (blue husky eyes)
  const ey=-s*.42;
  CX.fillStyle='#87ceeb';
  CX.beginPath();CX.ellipse(-s*.16,ey,s*.1,s*.08,0,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.ellipse(s*.16,ey,s*.1,s*.08,0,0,Math.PI*2);CX.fill();
  CX.fillStyle='#222';
  CX.beginPath();CX.arc(-s*.16,ey,s*.05,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(s*.16,ey,s*.05,0,Math.PI*2);CX.fill();
  CX.fillStyle='#fff';
  CX.beginPath();CX.arc(-s*.13,ey-s*.02,s*.025,0,Math.PI*2);CX.fill();
  CX.beginPath();CX.arc(s*.19,ey-s*.02,s*.025,0,Math.PI*2);CX.fill();
  
  // Tongue out (husky signature!)
  CX.fillStyle='#ff6b6b';
  CX.beginPath();CX.ellipse(0,ey+s*.16,s*.06,s*.1,0,0,Math.PI*2);CX.fill();
  CX.fillStyle='#ff9999';
  CX.beginPath();CX.ellipse(0,ey+s*.18,s*.04,s*.06,0,0,Math.PI*2);CX.fill();
  
  // Nose
  CX.fillStyle='#222';
  CX.beginPath();CX.ellipse(0,ey+s*.1,s*.05,s*.04,0,0,Math.PI*2);CX.fill();
  
  // Legs
  const la=Math.sin(G.frame*.12)*.03*s;
  CX.fillStyle='#999';
  CX.fillRect(-s*.22,s*.35,s*.14,s*.22+la);
  CX.fillRect(s*.08,s*.35,s*.14,s*.22-la);
  // White paws
  CX.fillStyle='#eee';
  CX.fillRect(-s*.22,s*.5,s*.14,s*.07);
  CX.fillRect(s*.08,s*.5,s*.14,s*.07);
  
  // Tail
  CX.strokeStyle='#999';CX.lineWidth=2.5;
  CX.beginPath();CX.moveTo(s*.25,s*.1);
  CX.quadraticCurveTo(s*.55,-s*.1,s*.6,-s*.05);
  CX.stroke();
  
  // HP bar
  if(hpR<1){
    const bw=s*1.3,bh=3;
    CX.fillStyle='rgba(0,0,0,.4)';CX.fillRect(-bw/2,-s*.85,bw,bh);
    CX.fillStyle=hpR>.5?'#44ff44':hpR>.25?'#ffaa00':'#ff4444';
    CX.fillRect(-bw/2,-s*.85,bw*hpR,bh);
  }
  CX.restore();
}

// ===== DRAW BACKGROUND =====
function drawBG(){
  const g=CX.createLinearGradient(0,0,0,500);
  g.addColorStop(0,'#c8e6ff');g.addColorStop(.6,'#ffdab9');
  CX.fillStyle=g;CX.fillRect(0,0,W,500);
  // Clouds
  CX.fillStyle='rgba(255,255,255,.5)';
  [[50,60],[180,40],[320,80],[100,120],[280,100]].forEach(([cx,cy])=>{
    const ox=Math.sin(G.frame*.002+cx)*15;
    CX.beginPath();CX.arc(cx+ox,cy,22,0,Math.PI*2);
    CX.arc(cx+ox+25,cy-4,18,0,Math.PI*2);
    CX.arc(cx+ox+12,cy-12,20,0,Math.PI*2);CX.fill();
  });
  // Ground
  CX.fillStyle='#90d86c';CX.fillRect(0,400,W,300);
  CX.fillStyle='#7ac85a';
  for(let x=0;x<W;x+=6)CX.fillRect(x,400,2,3+Math.sin(x*.3)*3);
  // Stripes
  CX.fillStyle='rgba(100,180,60,.2)';
  for(let i=0;i<8;i++)CX.fillRect(0,412+i*34,W,1);
}

// ===== DRAW UI =====
function drawUI(){
  // Top bar
  CX.fillStyle='rgba(0,0,0,.5)';
  CX.beginPath();CX.roundRect(4,4,404,36,8);CX.fill();
  
  CX.fillStyle='#ffd700';CX.font='bold 11px sans-serif';
  CX.textAlign='left';CX.fillText('⚡'+Math.floor(G.energy)+'/'+G.maxEnergy,12,28);
  CX.fillStyle='rgba(255,255,255,.2)';CX.fillRect(80,14,100,8);
  CX.fillStyle='#ffd700';CX.fillRect(80,14,100*(G.energy/G.maxEnergy),8);
  
  CX.textAlign='center';CX.fillText('💰'+Math.floor(G.money),200,28);
  
  CX.fillStyle='#ff6b6b';CX.font='9px sans-serif';
  CX.textAlign='right';CX.fillText('🏠',270,22);
  CX.fillStyle='rgba(255,255,255,.2)';CX.fillRect(278,14,60,8);
  CX.fillStyle='#44ff44';CX.fillRect(278,14,60*(G.baseHp/G.maxBaseHp),8);
  
  CX.textAlign='center';CX.fillText('👾',352,22);
  CX.fillStyle='rgba(255,255,255,.2)';CX.fillRect(338,14,60,8);
  CX.fillStyle='#ff4444';CX.fillRect(338,14,60*(G.enemyBaseHp/G.maxEnemyBaseHp),8);
  
  CX.fillStyle='#fff';CX.font='bold 10px sans-serif';CX.textAlign='right';
  CX.fillText('Wave '+(Math.floor(G.frame/600)+1),404,28);
  
  // Bottom cat buttons
  CX.fillStyle='rgba(0,0,0,.45)';
  CX.beginPath();CX.roundRect(8,596,396,94,10);CX.fill();
  
  const bw=54,startX=14;
  for(let i=0;i<CAT_TYPES.length;i++){
    const ct=CAT_TYPES[i],bx=startX+i*(bw+2);
    const ok=G.money>=ct.cost&&CAT_CD[i]<=0;
    
    CX.fillStyle=i===G.selectedCat?'rgba(255,215,0,.4)':'rgba(255,255,255,.1)';
    CX.beginPath();CX.roundRect(bx,602,bw,78,6);CX.fill();
    
    // Cat icon (small orange cat)
    const is=CX;
    is.fillStyle='#ff8c42';
    is.beginPath();is.arc(bx+bw/2,636,11,0,Math.PI*2);is.fill();
    is.fillStyle='#d2691e';
    is.beginPath();is.moveTo(bx+bw/2-9,628);is.lineTo(bx+bw/2-7,618);is.lineTo(bx+bw/2-4,628);is.fill();
    is.beginPath();is.moveTo(bx+bw/2+9,628);is.lineTo(bx+bw/2+7,618);is.lineTo(bx+bw/2+4,628);is.fill();
    
    CX.fillStyle=ok?'#ffd700':'#ff4444';CX.font='bold 8px sans-serif';
    CX.textAlign='center';CX.fillText('💰'+ct.cost,bx+bw/2,665);
    
    if(CAT_CD[i]>0){
      CX.fillStyle='rgba(0,0,0,.5)';
      CX.beginPath();CX.roundRect(bx,602,bw,78,6);CX.fill();
      CX.fillStyle='#fff';CX.font='bold 14px sans-serif';
      CX.fillText(Math.ceil(CAT_CD[i]/60),bx+bw/2,652);
    }
    if(i===G.selectedCat){
      CX.strokeStyle='#ffd700';CX.lineWidth=2;
      CX.beginPath();CX.roundRect(bx,602,bw,78,6);CX.stroke();
    }
    CX.fillStyle='rgba(255,255,255,.3)';CX.font='8px sans-serif';
    CX.textAlign='center';CX.fillText(i+1,bx+bw/2,612);
  }
  CX.fillStyle='#fff';CX.font='bold 8px sans-serif';CX.textAlign='center';
  CX.fillText(CAT_TYPES[G.selectedCat].name,206,698);
}

// ===== UPDATE =====
function update(){
  if(G.pause)return;
  G.frame++;
  G.energy=Math.min(G.maxEnergy,G.energy+G.energyRegen);
  G.money=Math.min(9999,G.money+G.moneyRegen);
  for(let i=0;i<CAT_TYPES.length;i++)if(CAT_CD[i]>0)CAT_CD[i]--;
  
  G.spawnTimer++;
  if(G.spawnTimer>Math.max(80,300-G.frame*.02)){G.spawnTimer=0;spawnEnemy();}
  
  // Update cats
  for(let i=G.cats.length-1;i>=0;i--){
    const c=G.cats[i];
    let target=null,md=999;
    G.enemies.forEach(e=>{const d=e.x-c.x;if(d>0&&d<md){md=d;target=e;}});
    if(target&&md<c.range+10){
      c.vx=0;c.atkCD--;
      if(c.atkCD<=0){c.atkCD=c.atkInt;target.hp-=c.atk;
        addParticles(target.x,target.y,5,'#ff0');
        if(target.hp<=0){G.enemies.splice(G.enemies.indexOf(target),1);G.money=Math.min(9999,G.money+30);addParticles(target.x,target.y,15,'#ffd700');}}
    } else {c.vx=CAT_TYPES[c.type].spd;c.x+=c.vx;}
    if(c.x>380){G.enemyBaseHp-=c.atk*.5;G.cats.splice(i,1);}
    if(c.hp<=0){addParticles(c.x,c.y,12,'#ff6666');G.cats.splice(i,1);}
  }
  
  // Update enemies
  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i];
    let target=null,md=999;
    G.cats.forEach(c=>{const d=c.x-e.x;if(d>0&&d<md){md=d;target=c;}});
    if(target&&md<25){e.vx=0;e.atkCD--;
      if(e.atkCD<=0){e.atkCD=e.atkInt;target.hp-=e.atk;
        if(target.hp<=0)G.cats.splice(G.cats.indexOf(target),1);}
    } else {e.vx=-(ENEMY_TYPES[e.type]?ENEMY_TYPES[e.type].spd:1.5);e.x+=e.vx;}
    if(e.x<30){G.baseHp-=e.atk*1.5;G.enemies.splice(i,1);}
  }
  
  // Particles
  for(let i=G.particles.length-1;i>=0;i--){
    const p=G.particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life--;
    if(p.life<=0)G.particles.splice(i,1);
  }
  
  if(G.baseHp<=0)G.scene='gameover';
  if(G.enemyBaseHp<=0)G.scene='win';
}

// ===== DRAW BASES =====
function drawBases(){
  // Player base (橘貓城堡)

  CX.fillStyle='#ff4444';
  CX.font='22px sans-serif';CX.textAlign='center';CX.fillText('🐱',36,365);
  CX.fillStyle='#ff8c42';
  CX.fillRect(58,310,3,50);
  CX.fillStyle='#ffd700';
  CX.beginPath();CX.moveTo(61,310);CX.lineTo(82,318);CX.lineTo(61,326);CX.fill();

  CX.fillText('CEO',376,348);

  CX.fillStyle='#222';
  CX.fillRect(350,310,3,50);

  CX.fillStyle='#ff4444';CX.fillRect(352,338,48*(G.enemyBaseHp/G.maxEnemyBaseHp),4);

// ===== DRAW MENU =====
function drawMenu(){
  const g=CX.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#c8e6ff');g.addColorStop(1,'#ffdab9');CX.fillStyle=g;CX.fillRect(0,0,W,H);
  
  // Decorations
  for(let i=0;i<6;i++){
    const cx=40+i*70,cy=280+Math.sin(G.frame*.02+i)*50;
    drawOrangeCat(cx,cy,8,1,true);
  }
  for(let i=0;i=3;i++){
    const cx=60+i*120,cy=320+Math.sin(G.frame*.02+i+2)*40;
    drawHusky(cx,cy,8,1);
  }
  
  // Title box
  CX.fillStyle='rgba(0,0,0,.5)';
  CX.beginPath();CX.roundRect(35,100,342,145,20);CX.fill();
  
  CX.fillStyle='#ffd700';CX.font='bold 32px sans-serif';CX.textAlign='center';
  CX.fillText('🐱 橘犬不寧',206,148);
  CX.fillStyle='#fff';CX.font='bold 18px sans-serif';
  CX.fillText('～ 貓皇 vs CEO二哈 ～',206,180);
  CX.font='13px sans-serif';CX.fillStyle='#ddd';
  CX.fillText('橘貓大帝 v.s. CEO哈士奇軍團',206,210);
  CX.fillStyle='#aaa';CX.font='11px sans-serif';
  CX.fillText('保護你的城堡，摧毀CEO大樓！',206,235);
  
  // Start
  CX.fillStyle='#ff6b35';
  CX.beginPath();CX.roundRect(90,370,232,55,27);CX.fill();
  CX.fillStyle='rgba(255,255,255,.3)';
  CX.beginPath();CX.roundRect(90,370,232,28,27);CX.fill();
  CX.fillStyle='#fff';CX.font='bold 20px sans-serif';
  CX.fillText('▶ 開始戰鬥',206,402);
  
  // Instructions
  CX.fillStyle='rgba(0,0,0,.4)';
  CX.beginPath();CX.roundRect(30,450,352,210,12);CX.fill();
  CX.fillStyle='#fff';CX.font='12px sans-serif';CX.textAlign='left';
  [
    '🐱 金冠橘貓 = 你的軍隊！（1-7選貓）',
    '🐶 CEO哈士奇 = 敵人不斷湧入！',
    '⚡ 能量會自動回復，能量越多出越快',
    '💰 打敗敵人可獲得金幣！',
    '🏆 摧毀敵方CEO大樓 = 勝利',
    '⌨ 點擊選貓 | 空白鍵出擊 | P暫停'
  ].forEach((t,i)=>CX.fillText(t,46,478+i*30));
  
  CX.fillStyle='rgba(255,255,255,.3)';CX.font='9px sans-serif';CX.textAlign='center';
  CX.fillText('點擊畫面開始遊戲',206,685);
}

// ===== OVERLAY =====
function drawOverlay(){
  if(G.scene==='gameover'){
    CX.fillStyle='rgba(0,0,0,.6)';CX.fillRect(0,0,W,H);
    CX.fillStyle='#ff4444';CX.font='bold 40px sans-serif';CX.textAlign='center';
    CX.fillText('💀 戰敗',206,280);
    CX.fillStyle='#fff';CX.font='16px sans-serif';
    CX.fillText('城堡被CEO二哈攻破了...',206,330);
    CX.fillText('點擊重新挑戰',206,380);
  } else if(G.scene==='win'){
    CX.fillStyle='rgba(0,0,0,.6)';CX.fillRect(0,0,W,H);
    CX.fillStyle='#ffd700';CX.font='bold 40px sans-serif';CX.textAlign='center';
    CX.fillText('🏆 勝利！',206,280);
    CX.fillStyle='#fff';CX.font='16px sans-serif';
    CX.fillText('橘貓大帝擊敗了CEO哈士奇！',206,330);
    CX.fillText('點擊再來一局',206,380);
  }
}

// ===== RENDER =====
function render(){
  CX.clearRect(0,0,W,H);
  if(G.scene==='menu'){drawMenu();return}
  drawBG();drawBases();
  G.cats.forEach(c=>drawOrangeCat(c.x,c.y,c.size,c.hp/c.hpMax,true));
  G.enemies.forEach(e=>drawHusky(e.x,e.y,e.size,e.hp/e.hpMax));
  G.particles.forEach(p=>{CX.globalAlpha=p.life/p.maxL;CX.fillStyle=p.color;
    CX.beginPath();CX.arc(p.x,p.y,p.size,0,Math.PI*2);CX.fill()});
  CX.globalAlpha=1;
  drawUI();drawOverlay();
}

// ===== GAME LOOP =====
function gameLoop(){if(G.scene==='playing')update();render();requestAnimationFrame(gameLoop)}
function resetGame(){
  G.cats=[];G.enemies=[];G.particles=[];G.money=800;G.energy=100;G.frame=0;G.spawnTimer=0;
  G.baseHp=5000;G.maxBaseHp=5000;G.enemyBaseHp=5000;G.maxEnemyBaseHp=5000;
  for(let i=0;i<CAT_TYPES.length;i++)CAT_CD[i]=0;
}
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(r>w/2)r=w/2;if(r>h/2)r=h/2;
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);return this;
  };
}
gameLoop();
</script>
