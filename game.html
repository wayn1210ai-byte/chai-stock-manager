<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🤠 像素大冒險 - 6 Worlds!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:monospace;overflow:hidden}
#w{position:relative;border:3px solid #8B7355;border-radius:6px;box-shadow:0 0 30px rgba(139,115,85,.3)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;top:0;left:0;right:0;padding:4px 10px;display:flex;justify-content:space-between;pointer-events:none;z-index:10;color:#fff;text-shadow:2px 2px 0 #000;font-size:13px}
#ui>div{display:flex;align-items:center;gap:8px}
#bosshp{position:absolute;top:32px;left:50%;transform:translateX(-50%);width:200px;height:12px;background:rgba(0,0,0,.6);border:2px solid #FFD700;border-radius:4px;display:none;pointer-events:none;z-index:10}
#bosshp div{height:100%;background:linear-gradient(90deg,#F00,#F60,#FF0);border-radius:2px;transition:width .2s}
#mc{display:none;position:absolute;bottom:6px;left:0;right:0;justify-content:space-between;padding:0 8px;z-index:20;pointer-events:none}
.mbtn{pointer-events:auto;width:48px;height:48px;border:2px solid rgba(255,255,255,.4);border-radius:8px;background:rgba(0,0,0,.4);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:manipulation}
.mbtn:active{background:rgba(255,255,255,.2)}
.mg{display:flex;gap:5px;pointer-events:none}
.mg .mbtn{pointer-events:auto}
@media(pointer:coarse){#mc{display:flex!important}}
</style>
</head>
<body>
<div id="w">
<canvas id="c"></canvas>
<div id="ui"><div><span id="ln">🌵 沙漠</span><span id="sc">🏆 0</span></div><div><span id="lv"></span><canvas id="mm" width="90" height="24"></canvas></div></div>
<div id="bosshp"><div id="bhpfill" style="width:100%"></div></div>
<div id="mc"><div class="mg"><div class="mbtn" id="bL">◀</div><div class="mbtn" id="bR">▶</div></div><div class="mg"><div class="mbtn" id="bJ">▲▲</div><div class="mbtn" id="bS">⚡</div></div></div>
</div>
<script>
// ===== CANVAS =====
const CW=680,CH=400,TS=32,G=.55,JF=-10,MS=3,SP=6,MW=220;
const c=document.getElementById('c'),ctx=c.getContext('2d');
c.width=CW;c.height=CH;
const mm=document.getElementById('mm'),mx=mm.getContext('2d');
const bh=document.getElementById('bosshp'),bf=document.getElementById('bhpfill');

// ===== THEMES =====
const TH=[
 {n:'🌵 沙漠峽谷',sk:['#FF6B35','#FFB347'],gt:'#D4A04A',gb:'#C4903A',gd:'#B08030',mc:'#C4A35A',bs:8},
 {n:'🏘️ 邊境小鎮',sk:['#87CEEB','#B0E0E6'],gt:'#6B8E23',gb:'#556B2F',gd:'#3E4F1A',mc:'#8B7355',bs:10},
 {n:'🏙️ 繁華都市',sk:['#2a2a4e','#4a4a6e'],gt:'#555555',gb:'#444444',gd:'#333333',mc:'#708090',bs:12},
 {n:'🏰 黑暗地城',sk:['#1a1a0a','#0a0a0a'],gt:'#5C4033',gb:'#4A3728',gd:'#3A2A1A',mc:'#4A3728',bs:14},
 {n:'🍃 像素草原',sk:['#4FC3F7','#81D4FA'],gt:'#5CB85C',gb:'#4CAF50',gd:'#388E3C',mc:'#5CB85C',bs:16},
 {n:'🏭 工業區',sk:['#37474F','#546E7A'],gt:'#78909C',gb:'#607D8B',gd:'#455A64',mc:'#78909C',bs:18},
];

// ===== STATE =====
let st={sc:0,li:5,lv:0,ph:'play'};
let pl={x:0,y:0,vx:0,vy:0,w:28,h:36,onG:false,dir:1,fr:0,ft:0,sprint:false,jc:0};
let ky={};let lv=null;let ob=null;let bull=[];let cam={x:0,y:0};
let boss=null;let pfx=[];let ti=0;

// ===== LEVEL GEN =====
function genLV(li){
 let t=TH[li],h=15,w=MW,l=[];
 for(let y=0;y<h;y++){l[y]=[];for(let x=0;x<w;x++)l[y][x]=0;}
 // Ground with gentle waves
 for(let x=0;x<w;x++){
  let gndH=Math.min(14,Math.max(2,12-Math.floor(Math.sin(x*0.08)*1.5+Math.sin(x*0.03)*1)));
  l[gndH][x]=1;for(let y=gndH+1;y<h;y++)l[y][x]=2;
 }
 // Underground fill
 for(let x=0;x<w;x++)for(let y=15;y<20;y++){if(!l[y])l[y]=[];l[y][x]=2;}
 // Platforms
 for(let i=0;i<20;i++){
  let px=8+Math.floor(Math.random()*(w-12)),py=3+Math.floor(Math.random()*6),pw=2+Math.floor(Math.random()*5);
  for(let xx=px;xx<px+pw&&xx<w;xx++){l[py][xx]=1;l[py+1][xx]=2;}
 }
 // Gaps
 for(let gx=30;gx<w-15;gx+=15+Math.random()*20){
  let gw=2+Math.floor(Math.random()*2);
  for(let xx=gx;xx<gx+gw&&xx<w;xx++)for(let gy=0;gy<15;gy++)l[gy][xx]=0;
 }
 // Boss arena
 for(let x=MW-25;x<MW;x++){l[13][x]=1;l[14][x]=2;for(let y=12;y>=9;y--)l[y][x]=0;}
 return l;
}
function getGroundY(l,x){for(let y=0;y<15;y++)if(l[y][x]>0)return y;return 14;}
function isS(x,y){let tx=Math.floor(x/TS),ty=Math.floor(y/TS);return tx>=0&&tx<MW&&ty>=0&&ty<15&&lv[ty]&&lv[ty][tx]>0;}

function genOB(li){
 let o={co:[],en:[],px:3,py:0};
 o.py=getGroundY(lv,3)-1;
 // Coins
 for(let i=0;i<30;i++){
  let cx,cy;
  do{cx=8+Math.floor(Math.random()*(MW-16));cy=2+Math.floor(Math.random()*10);}while(lv[cy][cx]>0);
  o.co.push({x:cx*TS+16,y:cy*TS+16,cl:false});
 }
 // Enemies
 for(let i=0;i<8+li*2;i++){
  let ex,ey,at=0;
  do{ex=20+Math.floor(Math.random()*(MW-35));ey=getGroundY(lv,ex)-1;at++;}while((ey<1||lv[ey][ex]>0)&&at<50);
  if(ey>=1&&ey<15)o.en.push({x:ex*TS+16,y:ey*TS+8,vx:(Math.random()<.5?1:-1)*(.8+Math.random()*.5),al:true,hp:2+li,tt:0});
 }
 return o;
}

// ===== PLAYER =====
function upd(){
 let spd=ky['shift']?SP:MS;
 pl.sprint=ky['shift'];
 if(ky['a']||ky['left']){pl.vx=-spd;pl.dir=0;}
 else if(ky['d']||ky['right']){pl.vx=spd;pl.dir=1;}
 else pl.vx*=.7;
 if((ky['w']||ky['up']||ky[' '])&&pl.jc<2){
  pl.vy=pl.jc===0?JF:JF*0.85;
  pl.jc++;pl.onG=false;
 }
 pl.vy+=G;if(pl.vy>15)pl.vy=15;
 if(Math.abs(pl.vx)>.5){pl.ft++;if(pl.ft>4){pl.fr=(pl.fr+1)%4;pl.ft=0;}}else{pl.fr=0;pl.ft=0;}
 // H
 pl.x+=pl.vx;
 let x1=Math.floor(pl.x/TS),x2=Math.floor((pl.x+pl.w-1)/TS);
 let y1=Math.floor(pl.y/TS),y2=Math.floor((pl.y+pl.h-1)/TS);
 if(pl.vx>0&&(isS(x2*TS,y1*TS+4)||isS(x2*TS,y2*TS-4))){pl.x=x2*TS-pl.w;pl.vx=0;}
 if(pl.vx<0&&(isS(x1*TS+TS-1,y1*TS+4)||isS(x1*TS+TS-1,y2*TS-4))){pl.x=(x1+1)*TS;pl.vx=0;}
 // V
 pl.y+=pl.vy;
 let uy=Math.floor(pl.y/TS),dy=Math.floor((pl.y+pl.h-1)/TS);
 let xx1=Math.floor(pl.x/TS),xx2=Math.floor((pl.x+pl.w-1)/TS);
 pl.onG=false;
 if(pl.vy>0){if(isS(xx1*TS+2,dy*TS)||isS(xx2*TS-2,dy*TS)){pl.y=dy*TS-pl.h;pl.vy=0;pl.onG=true;pl.jc=0;}}
 else if(pl.vy<0){if(isS(xx1*TS+2,(uy+1)*TS-1)||isS(xx2*TS-2,(uy+1)*TS-1)){pl.y=(uy+1)*TS;pl.vy=0;}}
 if(pl.x<0)pl.x=0;if(pl.x>(MW-1)*TS)pl.x=(MW-1)*TS;
 if(pl.y>16*TS)die();
}

// ===== BULLETS =====
function updB(){
 for(let i=bull.length-1;i>=0;i--){
  let b=bull[i];b.x+=b.vx;b.y+=b.vy;b.l--;
  if(b.l<=0||b.x<0||b.x>MW*TS){bull.splice(i,1);continue;}
  for(let e of ob.en){if(!e.al)continue;if(Math.abs(b.x-e.x)<18&&Math.abs(b.y-e.y)<18){e.hp--;if(e.hp<=0){e.al=false;st.sc+=100;}bull.splice(i,1);break;}}
  if(boss&&boss.al&&!b.boss&&Math.abs(b.x-boss.x)<28&&Math.abs(b.y-boss.y)<28){boss.hp--;bull.splice(i,1);if(boss.hp<=0){boss.al=false;st.sc+=500;bh.style.display='none';}else bf.style.width=(boss.hp/boss.mhp*100)+'%';}
 }
}

// ===== ENEMIES =====
function updE(){
 for(let e of ob.en){
  if(!e.al)continue;e.x+=e.vx;
  let ex1=Math.floor(e.x/TS),ex2=Math.floor((e.x+30)/TS),ey=Math.floor((e.y+36)/TS);
  if(e.vx>0&&(isS(ex2*TS,ey*TS)||e.x>(MW-2)*TS))e.vx=-e.vx;
  if(e.vx<0&&(isS(ex1*TS+TS-1,ey*TS)||e.x<TS))e.vx=-e.vx;
  if(!isS(ex1*TS+4,ey*TS+2))e.y+=.5;
  if(Math.abs(e.x-pl.x)<22&&Math.abs(e.y-pl.y)<22)die();
  // Bob animation
  e.tt=(e.tt||0)+1;
 }
}

// ===== BOSS =====
function spawnBoss(li){
 let t=TH[li];
 boss={x:(MW-15)*TS,y:11*TS,vx:1.5,w:56,h:56,al:true,hp:t.bs,mhp:t.bs,timer:0,st:0};
 bh.style.display='block';bf.style.width='100%';
}
function updBoss(){
 if(!boss||!boss.al)return;
 boss.x+=boss.vx;
 if(boss.x<(MW-30)*TS||boss.x>(MW-5)*TS)boss.vx=-boss.vx;
 boss.st++;
 if(boss.st>40){boss.st=0;
  let dx=pl.x-boss.x,dy=pl.y-boss.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
  bull.push({x:boss.x+28,y:boss.y+28,vx:(dx/dist)*3,vy:(dy/dist)*3,l:80,boss:true});
 }
 if(Math.abs(boss.x-pl.x)<28&&Math.abs(boss.y-pl.y)<28)die();
}

function updC(){for(let c of ob.co){if(c.cl)continue;if(Math.abs(c.x-(pl.x+pl.w/2))<16&&Math.abs(c.y-(pl.y+pl.h/2))<16){c.cl=true;st.sc+=10;}}}
function die(){if(st.ph!=='play')return;st.li--;if(st.li<=0){st.ph='go';return;}st.ph='dying';setTimeout(()=>{if(st.ph==='dying'){loadLV(st.lv);st.ph='play';}},800);}
function fire(){if(st.ph!=='play'||bull.length>8)return;bull.push({x:pl.x+(pl.dir?pl.w:0),y:pl.y+pl.h/3,vx:(pl.dir?10:-10),vy:-1,l:50});}

function camUp(){
 let tx=pl.x-CW/2+pl.w/2,ty=pl.y-CH/2+pl.h/2;
 cam.x+=(tx-cam.x)*.1;cam.y+=(ty-cam.y)*.1;
 cam.x=Math.max(0,Math.min(MW*TS-CW,cam.x));
 cam.y=Math.max(0,Math.min(14*TS-CH,cam.y));
}

// ===== RENDER =====
function drawTile(x,y,t){
 let th=TH[st.lv];
 ctx.fillStyle=t===1?th.gt:th.gd;
 ctx.fillRect(x,y,TS,TS);
 ctx.fillStyle=t===1?th.gt:th.gb;
 ctx.fillRect(x+2,y+2,TS-4,TS-2);
 // Texture
 ctx.fillStyle='rgba(0,0,0,.08)';
 if((Math.floor(x/TS)+Math.floor(y/TS))%3===0)ctx.fillRect(x+8,y+4,3,3);
 ctx.strokeStyle='rgba(0,0,0,.15)';
 ctx.strokeRect(x,y,TS,TS);
}

function drawEnemy(e){
 let sx=e.x-cam.x,sy=e.y-cam.y+Math.sin((e.tt||0)*0.1)*2;
 if(sx<-32||sx>CW+32)return;
 // Body
 ctx.fillStyle='#C0392B';
 ctx.fillRect(sx+8,sy+8,16,24);
 ctx.fillRect(sx+4,sy+16,24,12);
 // Eyes
 ctx.fillStyle='#FF0';
 ctx.fillRect(sx+10,sy+12,5,5);
 ctx.fillRect(sx+17,sy+12,5,5);
 ctx.fillStyle='#000';
 ctx.fillRect(sx+12,sy+14,3,3);
 ctx.fillRect(sx+19,sy+14,3,3);
 // Feet
 ctx.fillStyle='#8B4513';
 ctx.fillRect(sx+6,sy+30,8,6);
 ctx.fillRect(sx+18,sy+30,8,6);
}

function drawPlayer(){
 let t=TH[st.lv];
 let px=pl.x-cam.x,py=pl.y-cam.y;
 // Body
 ctx.fillStyle='#DAA520';
 ctx.fillRect(px+8,py+4,12,24);
 ctx.fillRect(px+4,py+12,20,16);
 // Head
 ctx.fillStyle='#FFDAB9';
 ctx.fillRect(px+8,py-4,12,10);
 // Hat
 ctx.fillStyle='#8B4513';
 ctx.fillRect(px+6,py-8,16,6);
 ctx.fillRect(px+4,py-6,20,3);
 // Eyes
 ctx.fillStyle='#000';
 let ex=pl.dir?px+14:px+10;
 ctx.fillRect(ex,py+2,3,3);
 // Legs
 ctx.fillStyle='#2F4F4F';
 let lx=pl.vx!==0?(Math.floor(Date.now()/120)%2?0:6):0;
 ctx.fillRect(px+6+lx,py+28,6,8);
 ctx.fillRect(px+16-lx,py+28,6,8);
 // Boots
 ctx.fillStyle='#8B4513';
 ctx.fillRect(px+4+lx,py+34,8,4);
 ctx.fillRect(px+16-lx,py+34,8,4);
 // Sprint dust
 if(pl.sprint&&pl.onG){
  ctx.fillStyle='rgba(200,160,80,'+(.3+Math.sin(ti*10)*.2)+')';
  ctx.fillRect(px+(pl.dir?28:-12),py+32,8,6);
 }
}

function drawBoss(){
 if(!boss||!boss.al)return;
 let bx=boss.x-cam.x,by=boss.y-cam.y;
 let t=TH[st.lv];
 // Body
 ctx.fillStyle='#8B0000';
 ctx.fillRect(bx,by,56,48);
 ctx.fillRect(bx-8,by+8,72,32);
 // Eyes
 ctx.fillStyle='#FF0';
 ctx.fillRect(bx+10,by+8,10,10);
 ctx.fillRect(bx+36,by+8,10,10);
 ctx.fillStyle='#F00';
 ctx.fillRect(bx+13,by+11,5,5);
 ctx.fillRect(bx+39,by+11,5,5);
 // Crown
 ctx.fillStyle='#FFD700';
 ctx.fillRect(bx+14,by-6,28,8);
 ctx.beginPath();
 ctx.moveTo(bx+14,by-6);ctx.lineTo(bx+18,by-12);ctx.lineTo(bx+22,by-6);
 ctx.moveTo(bx+28,by-6);ctx.lineTo(bx+32,by-12);ctx.lineTo(bx+36,by-6);
 ctx.fill();
 // Mouth
 ctx.fillStyle='#400';
 ctx.fillRect(bx+18,by+30,20,6);
 // Attack flash
 if(boss.st>35)ctx.fillStyle='rgba(255,0,0,.2)';ctx.fillRect(bx,by,56,48);
}

function draw(){
 ti=Date.now()/200;
 let t=TH[st.lv];
 // Sky
 let g=ctx.createLinearGradient(0,0,0,CH);
 g.addColorStop(0,t.sk[0]);g.addColorStop(1,t.sk[1]);
 ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
 // Parallax hills
 for(let i=0;i<12;i++){
  let px=(i*120-cam.x*.3)%(CW+200)-100;
  ctx.fillStyle=t.gd+'55';
  ctx.beginPath();ctx.moveTo(px,CH-50);
  ctx.lineTo(px+40,CH-80-(i%3)*25);
  ctx.lineTo(px+80,CH-50);ctx.fill();
 }
 // Tiles
 let sx=Math.max(0,Math.floor(cam.x/TS)),ex=Math.min(MW,Math.ceil((cam.x+CW)/TS)+1);
 let sy=Math.max(0,Math.floor(cam.y/TS)),ey=Math.min(15,Math.ceil((cam.y+CH)/TS)+1);
 for(let y=sy;y<ey;y++)for(let x=sx;x<ex;x++){
  let idx=lv[y][x];
  if(idx===0)continue;
  drawTile(x*TS-cam.x,y*TS-cam.y,idx);
 }
 // Decorations (cacti/trees)
 for(let x=sx;x<ex;x+=5+Math.floor(Math.random()*3)){
  let gnd=getGroundY(lv,x);
  if(gnd>0&&gnd<14&&Math.random()<.3){
   let dx=x*TS-cam.x,dy=gnd*TS-cam.y-TS;
   ctx.fillStyle=t.gd;
   ctx.fillRect(dx+10,dy+8,12,24);
   ctx.fillRect(dx+4,dy+16,24,12);
  }
 }
 // Coins
 for(let c of ob.co){if(c.cl)continue;let cx=c.x-16-cam.x,cy=c.y-16-cam.y+Math.sin(ti+c.x)*3;if(cx<-16||cx>CW+16)continue;
  ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(cx+16,cy+16,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FFA500';ctx.beginPath();ctx.arc(cx+16,cy+16,4,0,Math.PI*2);ctx.fill();
 }
 // Enemies
 for(let e of ob.en){if(!e.al)continue;drawEnemy(e);}
 // Boss
 if(boss&&boss.al)drawBoss();
 // Bullets
 for(let b of bull){let bx=b.x-cam.x,by=b.y-cam.y;
  if(b.boss){ctx.fillStyle='#F00';ctx.beginPath();ctx.arc(bx,by,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FF0';ctx.beginPath();ctx.arc(bx,by,3,0,Math.PI*2);ctx.fill();}
  else{ctx.fillStyle='#FF0';ctx.fillRect(bx-2,by-2,10,4);}
 }
 // Player
 if(st.ph!=='go')drawPlayer();
 // Exit sign
 if(!boss||!boss.al){let fx=(MW-6)*TS-cam.x;ctx.fillStyle='#FFD700';ctx.fillRect(fx,12*TS-cam.y,14,28);ctx.fillStyle='#FF0';ctx.beginPath();ctx.arc(fx+7,12*TS-cam.y-4,5,0,Math.PI*2);ctx.fill();}
 // HUD
 document.getElementById('sc').textContent='🏆 '+st.sc;
 let le=document.getElementById('lv');le.innerHTML='';
 for(let i=0;i<st.li;i++)le.innerHTML+='<span>❤️</span>';
 // State overlays
 if(st.ph==='dying'){ctx.fillStyle='rgba(255,0,0,.3)';ctx.fillRect(0,0,CW,CH);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 24px monospace';ctx.fillText('💀 OUCH!',CW/2,CH/2-20);ctx.font='13px monospace';ctx.fillText('剩餘: '+'❤️'.repeat(st.li),CW/2,CH/2+10);}
 if(st.ph==='go'){ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,CW,CH);ctx.fillStyle='#F44';ctx.font='bold 40px monospace';ctx.textAlign='center';ctx.fillText('💀 GAME OVER',CW/2,CH/2-20);ctx.fillStyle='#FFD700';ctx.font='bold 20px monospace';ctx.fillText('得分: '+st.sc,CW/2,CH/2+20);ctx.fillStyle='#CCC';ctx.font='13px monospace';ctx.fillText('按 R 重來',CW/2,CH/2+55);}
 if(st.ph==='win'){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,CW,CH);ctx.fillStyle='#FFD700';ctx.font='bold 36px monospace';ctx.textAlign='center';ctx.fillText('🏆 全部通關!',CW/2,CH/2-20);ctx.fillStyle='#fff';ctx.font='bold 20px monospace';ctx.fillText('總分: '+st.sc,CW/2,CH/2+20);ctx.fillStyle='#CCC';ctx.font='13px monospace';ctx.fillText('按 R 再玩一次',CW/2,CH/2+55);}
 // Minimap
 mx.fillStyle='rgba(0,0,0,.7)';mx.fillRect(0,0,90,24);
 for(let y=0;y<15;y++)for(let x=0;x<MW;x++){if(lv[y][x]>0){mx.fillStyle=t.mc;mx.fillRect(x*90/MW,y*24/15,Math.ceil(90/MW),Math.ceil(24/15));}}
 mx.fillStyle='#0F0';mx.fillRect((pl.x/TS)*90/MW-1,(pl.y/TS)*24/15-1,2,2);
 mx.strokeStyle='rgba(255,255,255,.4)';mx.strokeRect((cam.x/TS)*90/MW,(cam.y/TS)*24/15,(CW/TS)*90/MW,(CH/TS)*24/15);
 if(boss&&boss.al){mx.fillStyle='#F00';mx.fillRect(((MW-15))*90/MW-2,11*24/15-2,5,5);}
}

function loadLV(li){
 lv=genLV(li);ob=genOB(li);
 pl.x=ob.px*TS+16;pl.y=ob.py*TS;
 pl.vx=0;pl.vy=0;pl.onG=false;pl.jc=0;
 bull=[];cam.x=0;cam.y=0;boss=null;bh.style.display='none';
 document.getElementById('ln').textContent=TH[li].n;
}
function reset(){st={sc:0,li:5,lv:0,ph:'play'};loadLV(0);}

function loop(){
 if(st.ph==='play'||st.ph==='dying'){
  if(st.ph==='play'){
   upd();updB();updE();updC();camUp();
   if(pl.x>(MW-28)*TS&&(!boss))spawnBoss(st.lv);
   if(boss&&boss.al)updBoss();
   if(pl.x>(MW-4)*TS&&(!boss||!boss.al)){st.lv++;if(st.lv>=6)st.ph='win';else loadLV(st.lv);}
  }
 }
 draw();requestAnimationFrame(loop);
}

// ===== CONTROLS =====
document.addEventListener('keydown',e=>{let k=e.key;
 if(k==='a'||k==='ArrowLeft')ky['left']=true;
 if(k==='d'||k==='ArrowRight')ky['right']=true;
 if(k==='w'||k==='ArrowUp'||k===' '||k==='Space'){e.preventDefault();ky['up']=true;}
 if(k==='z'||k==='x')fire();
 if(k==='Shift')ky['shift']=true;
 if((k==='r'||k==='R')&&(st.ph==='go'||st.ph==='win'))reset();
});
document.addEventListener('keyup',e=>{
 if(e.key==='a'||e.key==='ArrowLeft')ky['left']=false;
 if(e.key==='d'||e.key==='ArrowRight')ky['right']=false;
 if(e.key==='w'||e.key==='ArrowUp'||e.key===' '||e.key==='Space')ky['up']=false;
 if(e.key==='Shift')ky['shift']=false;
});
['bL','bR','bJ','bS'].forEach(id=>{let el=document.getElementById(id);if(!el)return;
 el.addEventListener('touchstart',e=>{e.preventDefault();
  if(id==='bL')ky['left']=true;if(id==='bR')ky['right']=true;if(id==='bJ'){ky['up']=true;}if(id==='bS')fire();
 });
 el.addEventListener('touchend',e=>{e.preventDefault();if(id==='bL')ky['left']=false;if(id==='bR')ky['right']=false;if(id==='bJ')ky['up']=false;});
});

// ===== START =====
reset();loop();
</script>
</body>
</html>
