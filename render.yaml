services:
  - type: web
    name: chai-stock-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 stock_server.py
    envVars:
      - key: PYTHONIOENCODING
        value: utf-8
      - key: LANG
        value: zh_TW.UTF-8
      - key: LC_ALL
        value: zh_TW.UTF-8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chai-stock-db
          property: connectionString

databases:
  - name: chai-stock-db
    databaseName: stocks
    user: chai_stock_user
    plan: free
